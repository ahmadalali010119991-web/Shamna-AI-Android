name: Publish verified signed Midan Al Khabar 1.3.10 APK
on:
  push:
    branches: [main]
    paths: ['.github/workflows/midan-publish-1310.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download exact signed APK and validate SHA256
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 1 --max-time 150 'https://qurl.sh/b3d129dbb25d44de/app-release.apk' -o /tmp/Midan-AlKhabar-v1.3.10.apk
          printf '%s  %s\n' 'cc1690c671fc9039bec5b8391c24540e70cbe02b03c43a218796003ff26c10f9' /tmp/Midan-AlKhabar-v1.3.10.apk | sha256sum -c -
          unzip -t /tmp/Midan-AlKhabar-v1.3.10.apk >/dev/null
          test "$(stat -c%s /tmp/Midan-AlKhabar-v1.3.10.apk)" = 3133529
      - name: Publish official GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create midan-v1.3.10 /tmp/Midan-AlKhabar-v1.3.10.apk \
            --repo ahmadalali010119991-web/Shamna-AI-Android \
            --title 'ميدان الخبر 1.3.10 — إصلاح زر Firebase ونظام التحديث' \
            --notes 'الإصدار 1.3.10 (build 14) موقّع بالشهادة الأصلية، ويزيل زر اختبار Firebase العائم مع الحفاظ على الإشعارات وروابط الأخبار.' \
            --latest=false
