name: Midan v3 image card no-overlap and logo tests
on:
  push:
    paths: ['.github/workflows/midan-news-card-e2e.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Set up Playwright
        shell: bash
        run: |
          npm install --no-save playwright@1.56.1
          if ! command -v google-chrome >/dev/null; then npx playwright install chromium; fi
      - name: End-to-end dynamic-card, real PNG and download test
        shell: bash
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
           let opts={headless:true};const fs=require('fs');const feature=fs.readFileSync('midan-site-snapshot/feature/news-card-studio.js','utf8');
           if(fs.existsSync('/usr/bin/google-chrome'))opts.executablePath='/usr/bin/google-chrome';
           const browser=await chromium.launch(opts);
           try{
             const context=await browser.newContext({viewport:{width:412,height:915},acceptDownloads:true,userAgent:'Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36 MidanAlKhabarApp/1.3.9'});
             const page=await context.newPage();
             await page.route('**/news-card-studio.js',route=>route.fulfill({status:200,contentType:'application/javascript',body:feature}));
             await page.goto('https://midan-al-khabar.vercel.app/',{waitUntil:'domcontentloaded',timeout:50000});
             await page.waitForSelector('#newsList',{timeout:20000});
             await page.evaluate(()=>{document.querySelector('#newsList').innerHTML='<article class="news-card" data-article="test-news-card-e2e"><div class="card-meta">سوريا</div><h3>خبر تجريبي لاختبار تصميم صورة الخبر داخل ميدان الخبر</h3><p class="card-desc">هذا نص تجريبي للبطاقة، وليس خبرًا حقيقيًا.</p><p class="source-name">ميدان الخبر</p><img src="/assets/icon-192-v2.png" alt="اختبار"></article>'});
             await page.locator('#newsList .mcs-create').waitFor({timeout:15000});
             if(await page.locator('#newsList .mcs-create').count()!==1)throw Error('Duplicate news card button');
             await page.locator('#newsList .mcs-create').click();
             await page.locator('#mcs-preview[src^="data:image/png"]').waitFor({timeout:15000});
             const dims=await page.locator('#mcs-preview').evaluate(async e=>{const img=new Image();img.src=e.src;await img.decode();return [img.naturalWidth,img.naturalHeight]});
             if(dims[0]!==1080||dims[1]!==1350)throw Error('Wrong PNG dimensions: '+dims.join('x'));
             const [download]=await Promise.all([page.waitForEvent('download',{timeout:20000}),page.locator('#mcs-save').click()]);
             if(!download.suggestedFilename().endsWith('.png'))throw Error('Download is not PNG');
             await page.locator('#mcs-size').selectOption('square');
             await page.waitForTimeout(750);
             const square=await page.locator('#mcs-preview').evaluate(async e=>{const img=new Image();img.src=e.src;await img.decode();return [img.naturalWidth,img.naturalHeight]});
             if(square[0]!==1080||square[1]!==1080)throw Error('Square size failed');
             for(const entry of [{source:'سانا',key:'sana'},{source:'الجزيرة',key:'aljazeera'},{source:'صهيب اليعربي',key:'suhaib'}]){
               const result=await page.evaluate(async (entry)=>{
                 const p=await window.MidanNewsCardStudio.render({title:'عنوان خبري توضيحي لاختبار بطاقة ميدان الخبر',summary:'هذا محتوى اختباري فقط.',source:entry.source,date:'2026-11-13T08:20:00Z'},'portrait');
                 return {key:p.sourceLogo,warning:p.warning,image:p.canvas.toDataURL('image/png').slice(0,22)};
               },entry);
               if(result.key!==entry.key)throw Error('Wrong source identity '+entry.source+': '+result.key);
               if(result.warning)throw Error('Source logo failed: '+entry.source+' '+result.warning);
               if(!result.image.startsWith('data:image/png;base64,'))throw Error('PNG failed for '+entry.source);
             }
             for(const [fmt,dimensions] of Object.entries({portrait:[1080,1350],square:[1080,1080],story:[1080,1920],wide:[1600,900]})){
               for(const photo of [true,false]){
                 const result=await page.evaluate(async ({fmt,photo})=>{
                   let src='';if(photo){const c=document.createElement('canvas');c.width=600;c.height=300;const g=c.getContext('2d');g.fillStyle='#987';g.fillRect(0,0,600,300);src=c.toDataURL('image/png')}
                   const p=await window.MidanNewsCardStudio.render({title:'عنوان طويل لاختبار توازن العناصر النصية في قالب الصورة مع الحفاظ على الحدود بدون أي تداخل بين النص والصورة أو التذييل في التصميم النهائي',summary:'تغطية إخبارية توضيحية للتأكد من سلامة الهوامش والتباين في جميع الأبعاد المتاحة للمستخدم.',source:'سانا',date:'2026-11-13T08:20:00Z',photo:src},fmt);
                   return {width:p.canvas.width,height:p.canvas.height,layout:p.layout,warning:p.warning,png:p.canvas.toDataURL('image/png').slice(0,22)};
                 },{fmt,photo});
                 if(result.width!==dimensions[0]||result.height!==dimensions[1]||!result.png.startsWith('data:image/png;'))throw Error('Bad '+fmt+' '+photo);
                 if(result.warning)throw Error('Rendering warning '+fmt+': '+result.warning);
                 if(result.layout.header+result.layout.footer>=result.height)throw Error('Invalid geometry '+fmt);
                 console.log('PASS geometry '+fmt+' image='+photo+' '+result.width+'x'+result.height);
               }
             }
             console.log('PASS: 3 local source logos, 4 geometries x 2 media modes, PNG download');
           }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Save passing test marker
        run: |
          set -euo pipefail
          printf 'PASS: new Midan V3 layout: 3 source logos, 4 formats x 2 media modes, browser PNG save; %s\n' "$(date -u -Iseconds)" > midan-site-snapshot/feature/production-e2e.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add midan-site-snapshot/feature/production-e2e.txt
          git commit -m 'test(midan): live image-card browser E2E passed'
          git push
