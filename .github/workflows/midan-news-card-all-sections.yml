name: Midan v3 sports and Syrian field news-card coverage
on:
  push:
    paths: ['.github/workflows/midan-news-card-all-sections.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: true}
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium
      - name: Run three feed card integration tests
        run: node midan-site-snapshot/qa/test-all-news-sections.cjs
      - name: Record success
        run: |
          printf 'PASS: sports, Syrian field voices, ordinary feed cards; dynamic image generation; %s\n' "$(date -u -Iseconds)" > midan-site-snapshot/feature/all-sections-test.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add midan-site-snapshot/feature/all-sections-test.txt
          git commit -m 'test(midan): news image feature works across all sections'
          git push
