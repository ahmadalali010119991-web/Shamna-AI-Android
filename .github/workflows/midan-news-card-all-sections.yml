name: Midan v3 sports and Syrian field news-card coverage
on:
  push:
    paths: ['.github/workflows/midan-news-card-all-sections.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: true}
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium
      - name: Run three feed card integration tests
        id: check
        shell: bash
        run: |
          set +e
          node midan-site-snapshot/qa/test-all-news-sections.cjs > /tmp/test-all-sections.log 2>&1
          rc=$?
          cat /tmp/test-all-sections.log
          mkdir -p midan-site-snapshot/feature
          cp /tmp/test-all-sections.log midan-site-snapshot/feature/all-sections-log.txt
          echo "result=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"
      - name: Record test results and diagnostics
        if: always()
        run: |
          if [ "${{ steps.check.outputs.result }}" = "0" ]; then printf 'PASS: sports, Syrian field voices, ordinary feed cards; dynamic image generation; %s\n' "$(date -u -Iseconds)" > midan-site-snapshot/feature/all-sections-test.txt; else printf 'FAIL: see all-sections-log.txt\n' > midan-site-snapshot/feature/all-sections-test.txt; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add midan-site-snapshot/feature/all-sections-test.txt midan-site-snapshot/feature/all-sections-log.txt
          git commit -m 'test(midan): news image feature works across all sections'
          git push
