name: Verify original images inside both Midan card layouts
on:
  push:
    branches: [midan-book-recovery-20261125]
    paths: ['.github/workflows/midan-photo-card-regression.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Exercise real original source photos in Chrome
        shell: bash
        run: |
          set -eu
          export CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          cat > test.mjs <<'JS'
          import assert from 'node:assert/strict';
          import {spawn} from 'node:child_process';
          import {writeFileSync,mkdtempSync} from 'node:fs';
          import {tmpdir} from 'node:os';
          import {join} from 'node:path';
          const chrome=spawn(process.env.CHROME_PATH,['--headless=new','--user-data-dir='+mkdtempSync(join(tmpdir(),'midan-chrome-')),'--no-sandbox','--disable-dev-shm-usage','--remote-debugging-port=9222','--remote-allow-origins=*','--window-size=390,844','about:blank'],{stdio:['ignore','ignore','inherit']});
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          try{
          let tabs;
          for(let i=0;i<100;i++){try{tabs=await(await fetch('http://127.0.0.1:9222/json/list')).json();break}catch{await sleep(250)}}
          assert(tabs?.length,'Chrome startup');const ws=new WebSocket(tabs.find(x=>x.type==='page').webSocketDebuggerUrl);await new Promise((resolve,reject)=>{ws.onopen=resolve;ws.onerror=reject});
          let seq=0;const pending=new Map();ws.onmessage=e=>{const m=JSON.parse(e.data);const p=pending.get(m.id);if(p){pending.delete(m.id);clearTimeout(p.timer);m.error?p.reject(Error(m.error.message)):p.resolve(m.result)}};
          function cdp(method,params={}){return new Promise((resolve,reject)=>{const id=++seq,timer=setTimeout(()=>{pending.delete(id);reject(Error('CDP timeout '+method))},120000);pending.set(id,{resolve,reject,timer});ws.send(JSON.stringify({id,method,params}))})}
          async function ev(expression){const r=await cdp('Runtime.evaluate',{expression,awaitPromise:true,returnByValue:true});if(r.exceptionDetails)throw Error(r.exceptionDetails.exception?.description||r.exceptionDetails.text);return r.result.value}
          await cdp('Page.enable');await cdp('Page.navigate',{url:'https://midan-archive.midan-khabar.workers.dev/'});
          let ready=false;for(let i=0;i<60;i++){try{ready=await ev("typeof MidanAwarenessCard==='object'&&typeof awarenessMessages!=='undefined'&&document.querySelector('#awarenessText')?.textContent.length>10");if(ready)break}catch{}await sleep(500)}assert(ready,'Live generator loaded');
          const result=await ev("(async()=>{const results=[];for(const id of [1602,1603,1604]){await openArticle('m:'+id,false);const a=selected;if(!a||a.channelMessageId!==id||!a.sourcePhotoReference||!a.sharePhotoUrls[0].startsWith('/media/article-photo/'))throw Error('original reference '+id);const res=await fetch(a.sharePhotoUrls[0]);if(!res.ok||!res.headers.get('content-type')?.startsWith('image/'))throw Error('source proxy '+id+' HTTP '+res.status);const raw=await res.blob();if(raw.size<1000)throw Error('image too small');for(const mode of ['portrait','wide']){const card=await MidanNewsCardStudio.render({title:a.title,summary:'',source:a.source,date:a.publishedAt,sourceUrl:a.sourceUrl,category:a.category,photo:a.sharePhotoUrls[0],photoFallback:a.imageUrl},mode);if(card.canvas.width!==(mode==='wide'?1600:1080)||card.canvas.height!==(mode==='wide'?900:1350))throw Error('layout dimensions '+mode);if(!card.layout.photo)throw Error('missing photo '+id+' '+mode);if(card.layout.titleLayout.lines.join(' ')!==MidanNewsCardStudio.clean(a.title))throw Error('truncated title '+id);results.push({id,mode,photo:true,width:card.canvas.width,height:card.canvas.height,sourceBytes:raw.size});if(id===1604&&mode==='portrait')window.testPng=card.canvas.toDataURL('image/png').split(',')[1];}closeArticle(false)}return results})()");
          console.log('LIVE ORIGINAL CARD RESULTS '+JSON.stringify(result));
          assert.equal(result.length,6);
          assert(result.every(x=>x.photo));
          const sample=await ev("window.testPng");writeFileSync('news-1604-render.png',Buffer.from(sample,'base64'));ws.close();
          }finally{chrome.kill('SIGTERM')}
          JS
          node test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: news-1604-render
          path: news-1604-render.png
          retention-days: 3
