# Retired legacy Midan-only publication workflow after Cloudflare migration.
# The previous implementation remains in Git history. Do not invoke the old shared bridge.
name: Midan legacy publisher retired
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Confirm legacy workflow is retired
        run: echo "Midan publication is managed through Cloudflare. No legacy requests or Telegram messages were sent."
