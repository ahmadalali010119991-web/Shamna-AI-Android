name: Publish Midan news and app updates to Telegram
# Live Syrian field voices enabled; preserve source attribution and prevent replay.
# Publish revised, source-grounded introductions for the four APK apps (once only).
# Telegram-safe pacing enabled for news and field voices.
# Arabic news, precise grounded location labels, native APK documents and icon cards.
# Verify safe two-news-per-cycle scheduling and APK upload retry.
# Run the authenticated Arabic-only handler; the push-test endpoint now delegates to it.
# No foreign-language link previews; apps are native APK attachments with published icons.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/midan-telegram-sync.yml']
  schedule:
    - cron: '3-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: midan-telegram-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Authenticate with GitHub OIDC and sync channel
        shell: bash
        env:
          BRIDGE_URL: https://dallalna-telegram-bridge.vercel.app/api/sync-v2
        run: |
          set -euo pipefail
          # All events use the same authenticated Syrian-first quality-checked publication engine.
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo "GitHub OIDC is not available"
            exit 1
          fi
          token="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=dallalna-telegram-bridge" | jq -r '.value')"
          if [[ -z "$token" || "$token" == "null" ]]; then
            echo "Could not obtain OIDC token"
            exit 1
          fi
          response="$(curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 8 --max-time 120 \
            -X POST -H "Authorization: Bearer ${token}" \
            -H "Content-Type: application/json" --data '{}' \
            "${BRIDGE_URL}")"
          # Do not report a successful CI run when the publisher returned HTTP 200
          # with ok:false, an error field, or invalid JSON.
          printf '%s\n' "$response" | jq '{ok,status,error,seeded,sentNews,sentVoices,sentApps,pendingNews,eligibleCount,publicationGuard,rates,errors}'
          if ! printf '%s\n' "$response" | jq -e 'type == "object" and .ok == true and (.error == null or .error == "")' >/dev/null; then
            echo "::error::Midan Telegram bridge reported a publishing failure; inspect its response and Vercel runtime logs."
            exit 1
          fi
          # Queue backlog is visible even if it is not itself an error; workers
          # may need retries for Telegram rate limits or missing source media.
          printf '%s\n' "$response" | jq -r '
            if (.pendingNews | type) == "number" and .pendingNews > 0
            then "::notice::Telegram has " + (.pendingNews|tostring) + " pending news items."
            else empty end
          '
          # APK uploads and app updates are dispatched idempotently by the minute heartbeat.
          # Do not repost existing applications on a GitHub push.

          # Secondary 07:00/19:00 Damascus photo attempt (daily Vercel cron is primary).
          # Backend idempotency prevents duplicate images for a time slot.
          if [[ "$GITHUB_EVENT_NAME" != "push" ]]; then
            if ! curl --silent --show-error --fail-with-body \
              --retry 1 --retry-delay 4 --max-time 45 \
              -X POST -H "Authorization: Bearer ${token}" \
              -H "Content-Type: application/json" --data '{}' \
              "https://dallalna-telegram-bridge.vercel.app/api/daily-v2" \
              | jq '{ok,status,period,reason}'; then
              echo "::warning::Daily exchange-image check failed; news sync remained successful."
            fi
          fi

      - name: Remove circulated tag from 33 trusted-voice posts
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          commit_message="$(jq -r '.head_commit.message // ""' "$GITHUB_EVENT_PATH")"
          if [[ "$commit_message" != *"[mkr-clean-voices-33]"* ]]; then exit 0; fi
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then echo "::error::OIDC missing"; exit 1; fi
          token="$(curl --fail --silent --show-error -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=dallalna-telegram-bridge" | jq -r '.value')"
          if [[ -z "$token" || "$token" == null ]]; then echo "::error::OIDC token missing"; exit 1; fi
          failures=0
          for batch in 0 1 2 3 4 5 6 7 8; do
            echo "Batch ${batch}"
            response="$(curl --silent --show-error --max-time 110 -X POST -H "Authorization: Bearer ${token}" -H "Content-Type: application/json" --data '{}' "https://dallalna-telegram-bridge.vercel.app/api/status-v2?trustedVoicesClean=20261112&batch=${batch}")"
            printf '%s\n' "$response" | jq '{ok,batch,results,error}'
            if ! printf '%s\n' "$response" | jq -e '.ok == true and ([.results[]? | select(.status != "edited" and .status != "already_clean")] | length == 0)' >/dev/null; then failures=$((failures+1)); fi
          done
          if [[ "$failures" -gt 0 ]]; then echo "::error::${failures} batches require review"; exit 1; fi

# Social button repair: align existing Telegram channel posts with @alislam_almutab_book on both platforms.
# Editorial test: inside Syria > Syrians abroad/refugees > major Middle East > exceptional world, no unrelated stories.

# Editorial policy: Syrian domestic first; Syrian diaspora second; major Middle East third; exceptional world only.

# Production bridge post-deploy OIDC sync verification: 2026-11-12; keep the authenticated publisher path unchanged.
