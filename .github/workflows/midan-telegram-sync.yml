name: Publish Midan news and app updates to Telegram
# Live Syrian field voices enabled; preserve source attribution and prevent replay.
# Publish revised, source-grounded introductions for the four APK apps (once only).
# Telegram-safe pacing enabled for news and field voices.
# Arabic news, precise grounded location labels, native APK documents and icon cards.
# Verify safe two-news-per-cycle scheduling and APK upload retry.
# Run the authenticated Arabic-only handler; the push-test endpoint now delegates to it.
# No foreign-language link previews; apps are native APK attachments with published icons.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/midan-telegram-sync.yml']
  schedule:
    - cron: '3-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: midan-telegram-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Authenticate with GitHub OIDC and sync channel
        shell: bash
        env:
          BRIDGE_URL: https://dallalna-telegram-bridge.vercel.app/api/sync-v2
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then BRIDGE_URL="https://dallalna-telegram-bridge.vercel.app/api/push-test"; fi
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo "GitHub OIDC is not available"
            exit 1
          fi
          token="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=dallalna-telegram-bridge" | jq -r '.value')"
          if [[ -z "$token" || "$token" == "null" ]]; then
            echo "Could not obtain OIDC token"
            exit 1
          fi
          response="$(curl --silent --show-error \
            --retry 2 --retry-delay 8 --max-time 120 \
            -X POST -H "Authorization: Bearer ${token}" \
            -H "Content-Type: application/json" --data '{}' \
            "${BRIDGE_URL}")"
          printf '%s\n' "$response" | jq '{ok,error,details,policy,newsSent,byPriority,eligibleRemaining,irrelevantSkipped,voices,errors}'
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            echo "Sending verified one-time app introductions"
            curl --fail-with-body --silent --show-error --retry 2 --max-time 80 \
              -X POST -H "Authorization: Bearer ${token}" \
              -H "Content-Type: application/json" --data '{}' \
              'https://dallalna-telegram-bridge.vercel.app/api/launch-apps' \
              | jq '{ok,results,geographyCorrection}'
          fi

          # Secondary 07:00/19:00 Damascus photo attempt (daily Vercel cron is primary).
          # Backend idempotency prevents duplicate images for a time slot.
          if [[ "$GITHUB_EVENT_NAME" != "push" ]]; then
            if ! curl --silent --show-error --fail-with-body \
              --retry 1 --retry-delay 4 --max-time 45 \
              -X POST -H "Authorization: Bearer ${token}" \
              -H "Content-Type: application/json" --data '{}' \
              "https://dallalna-telegram-bridge.vercel.app/api/daily-v2" \
              | jq '{ok,status,period,reason}'; then
              echo "::warning::Daily exchange-image check failed; news sync remained successful."
            fi
          fi

# Social button repair: align existing Telegram channel posts with @alislam_almutab_book on both platforms.
# Editorial test: inside Syria > Syrians abroad/refugees > major Middle East > exceptional world, no unrelated stories.

# Editorial policy: Syrian domestic first; Syrian diaspora second; major Middle East third; exceptional world only.
