name: Recover exact Midan public frontend
on:
  push:
    branches: [midan-exact-frontend-recovery-20261125]
    paths: ['.github/workflows/midan-exact-recovery.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: midan-exact-frontend-recovery-20261125
      - name: Recover and verify production public files
        run: python3 recover.py
      - name: Save verified files on recovery branch only
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "midan-exact-frontend-recovery-20261125"
          git config user.name 'Midan recovery CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RECOVERY_RESULT.json recovered-frontend/
          if ! git diff --cached --quiet; then
            git commit -m 'Restore hash-verified public Midan frontend files'
            git push origin HEAD:refs/heads/midan-exact-frontend-recovery-20261125
          fi
