name: Verify original Telegram source links and existing payload fields
on:
  push:
    branches: [midankhabar-daily53-links-20261111]
    paths: [telegram-shared/telegram-source-links.js,telegram-shared/test/source-links.test.js,.github/workflows/midan-source-links-tests.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - name: Test news source link transformation (no Telegram sending)
        working-directory: telegram-shared
        run: node --test test/source-links.test.js
