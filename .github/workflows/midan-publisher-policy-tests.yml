name: Verify Midan publisher delivery policy
on:
  push:
    branches: [main]
    paths:
      - "tools/midan-publisher/**"
      - ".github/workflows/midan-publisher-policy-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node tools/midan-publisher/delivery-policy.test.mjs
