name: Validate Midan sports-only feed
on:
  push:
    branches: [main]
    paths:
      - "tools/midan-publisher/sports-news.cjs"
      - "tools/midan-publisher/sports-news.test.cjs"
      - "tools/midan-publisher/sports-view.js"
      - ".github/workflows/midan-sports-regression.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Sports-only feed and academic Olympiad exclusions
        run: node tools/midan-publisher/sports-news.test.cjs
      - name: Sport navigation script syntax
        run: node --check tools/midan-publisher/sports-view.js
