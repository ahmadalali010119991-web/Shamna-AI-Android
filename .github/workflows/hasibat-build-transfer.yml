name: Transfer verified Hasibat 1.8.2 build delta
on:
  push:
    branches: [hasibat-al-lira]
    paths:
      - .github/workflows/hasibat-build-transfer.yml
      - hasibat-build/v182-dex.patch.b64
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pack-build-delta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hasibat-al-lira
      - name: Assemble verified v1.8.2 delta
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode < hasibat-build/v182-dex.patch.b64 > v182-dex.patch
          base64 --decode < hasibat-build/v182-manifest.patch.b64 > v182-manifest.patch
          echo '104cb80b7cb925869af6f0a242c806dfcbc695be3d2e76738cc6906ae2c21785  v182-dex.patch' | sha256sum --check
          echo 'e36f8ce9829bd674d42c5fab9eb762b8f7a678a98b94a5ed37811cfe66c49796  v182-manifest.patch' | sha256sum --check
      - uses: actions/upload-artifact@v4
        with:
          name: hasibat-v182-build-delta
          path: |
            v182-dex.patch
            v182-manifest.patch
          if-no-files-found: error
          retention-days: 2
