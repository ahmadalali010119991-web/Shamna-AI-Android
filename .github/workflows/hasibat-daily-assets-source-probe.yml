name: Inspect Hasibat gold and fuel live source contracts
on:
  push:
    branches: [hasibat-telegram-gold-fuel-0900-20261111]
    paths: [.github/workflows/hasibat-daily-assets-source-probe.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Inspect source response status and bounded excerpts
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,re,html,json
          urls=['https://sp-today.com/gold','https://hasibat-fuel-feed.vercel.app/api/fuel','https://dallalna-telegram-bridge.vercel.app/api/rates-preview?mode=metadata']
          for url in urls:
            print('URL',url)
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; Hasibat/1.8.23)','Accept':'text/html,application/json'})
              with urllib.request.urlopen(req,timeout=22) as response:
                content=response.read(3000000)
                print('HTTP',response.status,'TYPE',response.headers.get('Content-Type'),'BYTES',len(content))
              text=content.decode('utf-8','replace')
              if 'api/fuel' in url:
                print('BODY',text[:4500])
              elif '/gold' in url:
                text=re.sub(r'<script\b[^>]*>[\s\S]*?</script>',' ',text,flags=re.I)
                text=re.sub(r'<style\b[^>]*>[\s\S]*?</style>',' ',text,flags=re.I)
                text=html.unescape(re.sub(r'<[^>]+>',' ',text))
                text=re.sub(r'\s+',' ',text)
                for word in ['عيار 24','عيار 22','عيار 21','عيار 18','عيار 14','شراء','مبيع','ذهب','غرام','الذهب']:
                  i=text.find(word)
                  print('GOLD_TERM',word,'INDEX',i,'SNIPPET',text[max(0,i-120):i+320] if i>=0 else '')
              else:
                try:
                  d=json.loads(text)
                  print('KEYS',list(d)[:20], 'AGE',d.get('ageSeconds'),'ROWS',str(d.get('rows',[]))[:1300])
                except:print('BODY',text[:700])
            except Exception as exc:print('ERROR',type(exc).__name__,str(exc)[:250])
          PY
