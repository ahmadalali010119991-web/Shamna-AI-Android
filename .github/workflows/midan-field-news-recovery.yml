name: Midan verify and recover public activist news, last 10 hours
on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    paths:
      - '.github/workflows/midan-field-news-recovery.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: midan-field-recovery
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - run: python -m pip install beautifulsoup4==4.13.4
      - name: Fetch verified public Telegram channels, keep only source-attributed news
        run: python midan-site-snapshot/diagnostics/field_news_recover.py
      - name: Save only changed ten-hour feed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add midan-site-snapshot/data/field-news-10h.json midan-site-snapshot/data/field-news-audit.json
          if ! git diff --cached --quiet; then
            git commit -m 'data(midan): refresh verified recent activist news and media metadata'
            git pull --rebase
            git push
          fi
