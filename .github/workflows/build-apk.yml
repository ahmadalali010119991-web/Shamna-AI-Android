      - name: Keep WebView session alive in background
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Keep one Activity/task instance and avoid needless recreation.
          mp = Path("app/src/main/AndroidManifest.xml")
          ms = mp.read_text(encoding="utf-8")
          old_cfg = 'android:configChanges="orientation|screenSize|keyboardHidden"'
          new_cfg = 'android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize|uiMode"'
          if old_cfg in ms:
              ms = ms.replace(old_cfg, new_cfg, 1)

          activity_marker = 'android:name=".MainActivity"'
          if activity_marker not in ms:
              raise SystemExit("MainActivity manifest entry not found")
          if 'android:launchMode="singleTask"' not in ms:
              ms = ms.replace(activity_marker, activity_marker + '\n            android:launchMode="singleTask"', 1)
          if 'android:alwaysRetainTaskState="true"' not in ms:
              ms = ms.replace(activity_marker, activity_marker + '\n            android:alwaysRetainTaskState="true"', 1)
          mp.write_text(ms, encoding="utf-8")

          p = Path("app/src/main/java/com/shamna/ai/MainActivity.java")
          src = p.read_text(encoding="utf-8")

          # Keep the WebView renderer important even when the Activity is not visible.
          if "SHAMNA_BACKGROUND_RENDERER_PRIORITY_V1" not in src:
              needle = "webView = findViewById(R.id.webView);"
              if needle not in src:
                  raise SystemExit("WebView initialization not found")
              code = r'''
                  // SHAMNA_BACKGROUND_RENDERER_PRIORITY_V1
                  if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.O) {
                      webView.setRendererPriorityPolicy(
                          android.webkit.WebView.RENDERER_PRIORITY_IMPORTANT,
                          false
                      );
                  }
              '''
              src = src.replace(needle, needle + "\n" + code, 1)

          # The old root-back behavior finished the Activity, which destroyed
          # the WebView and aborted any in-flight answer. Put the task in the
          # background instead, preserving the exact live WebView/session.
          if "SHAMNA_BACKGROUND_BACK_V1" not in src:
              sig = "public void onBackPressed()"
              sp = src.find(sig)
              if sp < 0:
                  raise SystemExit("onBackPressed method not found")
              brace = src.find("{", sp)
              if brace < 0:
                  raise SystemExit("onBackPressed opening brace not found")
              depth = 0
              end = -1
              for i in range(brace, len(src)):
                  if src[i] == "{":
                      depth += 1
                  elif src[i] == "}":
                      depth -= 1
                      if depth == 0:
                          end = i
                          break
              if end < 0:
                  raise SystemExit("onBackPressed closing brace not found")
              method = src[sp:end+1]
              if "super.onBackPressed();" not in method:
                  raise SystemExit("Root onBackPressed fallback not found")
              method = method.replace(
                  "super.onBackPressed();",
                  "// SHAMNA_BACKGROUND_BACK_V1\n            moveTaskToBack(true);",
                  1
              )
              src = src[:sp] + method + src[end+1:]

          # Resume timers explicitly when returning. We intentionally DO NOT
          # call WebView.onPause()/pauseTimers() when backgrounding because
          # that would stop JavaScript work and streaming responses.
          if "SHAMNA_BACKGROUND_RESUME_V1" not in src:
              insert_at = src.rfind("\n}")
              if insert_at < 0:
                  raise SystemExit("MainActivity closing brace not found")
              method = r'''

              // SHAMNA_BACKGROUND_RESUME_V1
              @Override
              protected void onResume() {
                  super.onResume();
                  if (webView != null) {
                      try {
                          webView.onResume();
                          webView.resumeTimers();
                      } catch (Exception ignored) {}
                  }
              }
              '''
              src = src[:insert_at] + method + src[insert_at:]

          # Do not tear down the WebView for a transient Activity destruction.
          # Full cleanup still happens when the Activity is genuinely finishing.
          if "SHAMNA_SAFE_DESTROY_V1" not in src:
              sig = "protected void onDestroy()"
              sp = src.find(sig)
              if sp < 0:
                  raise SystemExit("onDestroy method not found")
              brace = src.find("{", sp)
              if brace < 0:
                  raise SystemExit("onDestroy opening brace not found")
              depth = 0
              end = -1
              for i in range(brace, len(src)):
                  if src[i] == "{":
                      depth += 1
                  elif src[i] == "}":
                      depth -= 1
                      if depth == 0:
                          end = i
                          break
              if end < 0:
                  raise SystemExit("onDestroy closing brace not found")
              replacement = r'''protected void onDestroy() {
                  // SHAMNA_SAFE_DESTROY_V1
                  if (webView != null && isFinishing() && !isChangingConfigurations()) {
                      try {
                          webView.stopLoading();
                          webView.setWebChromeClient(null);
                          webView.setWebViewClient(null);
                          webView.removeAllViews();
                          webView.destroy();
                      } catch (Exception ignored) {}
                  }
                  super.onDestroy();
              }'''
              src = src[:sp] + replacement + src[end+1:]

          p.write_text(src, encoding="utf-8")
          print("Background WebView/session continuity patch applied")
          PY

      - name: Speed up initial WebView rendering
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/java/com/shamna/ai/MainActivity.java")
          src = p.read_text(encoding="utf-8")

          # Hardware acceleration at the view level and normal WebView cache.
          if "SHAMNA_STARTUP_PERF_V1" not in src:
              needle = "WebSettings settings = webView.getSettings();"
              if needle not in src:
                  raise SystemExit("WebSettings initialization not found")
              code = r'''
                  // SHAMNA_STARTUP_PERF_V1
                  webView.setLayerType(android.view.View.LAYER_TYPE_HARDWARE, null);
                  settings.setCacheMode(android.webkit.WebSettings.LOAD_DEFAULT);
                  settings.setLoadsImagesAutomatically(true);
                  // SHAMNA_FAST_ACCESS_V1
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
              '''
              src = src.replace(needle, needle + "\n" + code, 1)

          # Show the page as soon as Chromium commits visible content instead of
          # keeping the loading overlay up until every subresource finishes.
          if "SHAMNA_COMMIT_VISIBLE_V1" not in src:
              needle = "webView.setWebViewClient(new WebViewClient() {"
              cp = src.find(needle)
              if cp < 0:
                  raise SystemExit("WebViewClient block not found")
              brace = src.find("{", cp)
              method = r'''
                  // SHAMNA_COMMIT_VISIBLE_V1
                  @Override
                  public void onPageCommitVisible(android.webkit.WebView view, String url) {
                      try {
                          if (progressBar != null) progressBar.setVisibility(android.view.View.GONE);
                          view.setVisibility(android.view.View.VISIBLE);
                      } catch (Exception ignored) {}
                  }
              '''
              src = src[:brace+1] + "\n" + method + src[brace+1:]

          # Do not hide the WebView during navigation.
          src = src.replace(
              "progressBar.setVisibility(View.VISIBLE);",
              "progressBar.setVisibility(View.VISIBLE);\n                view.setVisibility(View.VISIBLE);",
              1
          )

          p.write_text(src, encoding="utf-8")
          print("Startup rendering performance patch applied")
          PY

      - name: Verify project files
        shell: bash
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          echo "Required Android project files found"

      - name: Build debug APK
        shell: bash
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK exists
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK was not generated"
            find app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

      - name: Rename APK
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Shamna-AI.apk
          ls -lh Shamna-AI.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shamna-AI-APK
          path: Shamna-AI.apk
          if-no-files-found: error
          retention-days: 30
