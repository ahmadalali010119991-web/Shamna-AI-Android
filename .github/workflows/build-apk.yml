name: Build Shamna AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            echo "sdkmanager not found at expected path:"
            echo "$SDKMANAGER"
            echo "ANDROID_HOME=$ANDROID_HOME"
            find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -20
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Shamna AI project
        shell: bash
        run: |
          unzip -o Shamna_AI_Android_Project.zip
          echo "Project extracted"
          ls -la
          ls -la app

      - name: Fix Android permission code
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/java/com/shamna/ai/MainActivity.java")

          if not p.exists():
              raise SystemExit(f"MainActivity.java not found: {p}")

          s = p.read_text(encoding="utf-8")

          s = s.replace(
              "checkSelfPermission(MainActivity.this, Manifest.permission.CAMERA)",
              "checkSelfPermission(Manifest.permission.CAMERA)"
          )

          s = s.replace(
              "checkSelfPermission(MainActivity.this, Manifest.permission.RECORD_AUDIO)",
              "checkSelfPermission(Manifest.permission.RECORD_AUDIO)"
          )

          p.write_text(s, encoding="utf-8")

          print("MainActivity.java updated successfully")
          PY


      - name: Fix Android safe areas
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/src/main/java/com/shamna/ai/MainActivity.java")
          s = p.read_text(encoding="utf-8")

          marker = "SHAMNA_SAFE_AREA_FIX"
          if marker not in s:
              code = r'''
                  // SHAMNA_SAFE_AREA_FIX
                  final android.view.View shamnaRoot = findViewById(android.R.id.content);
                  if (shamnaRoot != null && android.os.Build.VERSION.SDK_INT >= 20) {
                      shamnaRoot.setOnApplyWindowInsetsListener((view, insets) -> {
                          int topInset = insets.getSystemWindowInsetTop();
                          view.setPadding(
                              view.getPaddingLeft(),
                              topInset,
                              view.getPaddingRight(),
                              0
                          );
                          return insets;
                      });
                      shamnaRoot.requestApplyInsets();
                  }

                  getWindow().setStatusBarColor(android.graphics.Color.rgb(4, 47, 31));
                  getWindow().setNavigationBarColor(android.graphics.Color.rgb(4, 47, 31));
              '''

              m = re.search(r'(^\s*setContentView\s*\([^;]+\);\s*$)', s, flags=re.M)
              if not m:
                  raise SystemExit("Could not find setContentView(...) in MainActivity.java")

              s = s[:m.end()] + "\n" + code + s[m.end():]

          p.write_text(s, encoding="utf-8")
          print("Safe-area fix applied successfully")
          PY

      - name: Fix keyboard chat UX
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          p = Path("app/src/main/java/com/shamna/ai/MainActivity.java")
          s = p.read_text(encoding="utf-8")

          # Ensure the activity always resizes for the soft keyboard.
          if "SHAMNA_KEYBOARD_RESIZE" not in s:
              m = re.search(r'(^\s*setContentView\s*\([^;]+\);\s*$)', s, flags=re.M)
              if not m:
                  raise SystemExit("Could not find setContentView(...)")
              native = """
                  // SHAMNA_KEYBOARD_RESIZE
                  getWindow().setSoftInputMode(
                      android.view.WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE
                      | android.view.WindowManager.LayoutParams.SOFT_INPUT_STATE_ALWAYS_HIDDEN
                  );
              """
              s = s[:m.end()] + "\n" + native + s[m.end():]

          # Inject a compact mobile layout fix after each page finishes loading.
          if "SHAMNA_KEYBOARD_WEB_FIX" not in s:
              js = r"""
          (function(){
            if (window.__shamnaKeyboardFixInstalled) {
              if (window.__shamnaApplyViewportFix) window.__shamnaApplyViewportFix();
              return;
            }
            window.__shamnaKeyboardFixInstalled = true;

            var style = document.createElement('style');
            style.id = 'shamna-keyboard-fix';
            style.textContent = [
              'html,body{margin:0!important;max-width:100%!important;}',
              'html{height:var(--shamna-vh,100dvh)!important;overflow:hidden!important;}',
              'body{height:var(--shamna-vh,100dvh)!important;min-height:0!important;overflow:hidden!important;}',
              'body>div:first-of-type{height:var(--shamna-vh,100dvh)!important;min-height:0!important;max-height:var(--shamna-vh,100dvh)!important;}',
              'header,[role="banner"],[class*="header" i],[class*="topbar" i],[class*="top-bar" i]{flex-shrink:0!important;z-index:99999!important;}',
              '[class*="messages" i],[class*="conversation" i],[class*="chat" i],[class*="history" i]{min-height:0!important;overflow-y:auto!important;overscroll-behavior-y:contain!important;-webkit-overflow-scrolling:touch!important;}',
              'textarea,input,[contenteditable="true"]{scroll-margin-top:88px!important;scroll-margin-bottom:110px!important;}'
            ].join('');

            (document.head || document.documentElement).appendChild(style);

            function makeLikelyChatScrollable(){
              var all = document.querySelectorAll('div,main,section');
              for (var i=0;i<all.length;i++){
                var el=all[i];
                var cs=getComputedStyle(el);
                var r=el.getBoundingClientRect();
                if (r.height>120 && r.width>200 && (cs.overflowY==='hidden' || cs.overflowY==='clip')) {
                  if (el.scrollHeight > el.clientHeight + 24) {
                    el.style.setProperty('overflow-y','auto','important');
                    el.style.setProperty('min-height','0','important');
                    el.style.setProperty('overscroll-behavior-y','contain','important');
                    el.style.setProperty('-webkit-overflow-scrolling','touch','important');
                  }
                }
              }
            }

            function keepTopBarVisible(){
              var els = document.querySelectorAll('header,nav,div');
              for (var i=0;i<els.length;i++){
                var el=els[i], txt=(el.innerText||'').trim(), r=el.getBoundingClientRect();
                if (txt.indexOf('Shamna AI')!==-1 && r.height>35 && r.height<140 && r.width>220) {
                  var buttons=el.querySelectorAll('button,a,[role="button"]');
                  if (buttons.length>=2 && r.top<160) {
                    el.style.setProperty('position','sticky','important');
                    el.style.setProperty('top','0','important');
                    el.style.setProperty('z-index','2147483000','important');
                    el.style.setProperty('flex-shrink','0','important');
                    break;
                  }
                }
              }
            }

            function applyViewportFix(){
              var vv=window.visualViewport;
              var h=Math.round(vv ? vv.height : window.innerHeight);
              if(h<200) h=window.innerHeight;
              document.documentElement.style.setProperty('--shamna-vh',h+'px');
              makeLikelyChatScrollable();
              keepTopBarVisible();
            }

            window.__shamnaApplyViewportFix=applyViewportFix;
            applyViewportFix();

            if(window.visualViewport){
              visualViewport.addEventListener('resize',function(){
                applyViewportFix();
                setTimeout(applyViewportFix,80);
                setTimeout(applyViewportFix,250);
              });
              visualViewport.addEventListener('scroll',applyViewportFix);
            }
            window.addEventListener('resize',applyViewportFix);

            document.addEventListener('focusin',function(e){
              var t=e.target;
              if(!t) return;
              var tag=(t.tagName||'').toLowerCase();
              if(tag==='textarea' || tag==='input' || t.isContentEditable){
                setTimeout(function(){
                  applyViewportFix();
                  try{t.scrollIntoView({block:'nearest',inline:'nearest',behavior:'auto'});}catch(_){}
                },180);
              }
            },true);

            document.addEventListener('focusout',function(){
              setTimeout(applyViewportFix,180);
            },true);

            new MutationObserver(function(){setTimeout(applyViewportFix,30);})
              .observe(document.documentElement,{childList:true,subtree:true});
          })();
              """
              java_literal = json.dumps(js, ensure_ascii=False)

              old = "                progressBar.setVisibility(View.GONE);"
              if old not in s:
                  raise SystemExit("Could not find onPageFinished progress line")
              replacement = old + """
                  // SHAMNA_KEYBOARD_WEB_FIX
                  view.evaluateJavascript(""" + java_literal + """, null);"""
              s = s.replace(old, replacement, 1)

          p.write_text(s, encoding="utf-8")
          print("Keyboard/chat UX fix applied successfully")
          PY

      - name: Fix WebView downloads
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json

          p = Path("app/src/main/java/com/shamna/ai/MainActivity.java")
          s = p.read_text(encoding="utf-8")

          # Always load the real Shamna generator directly.
          s = s.replace("https://shamna-ai.vercel.app", "https://perchance.org/shamna-ai")

          m = re.search(r'\bWebView\s+(\w+)\s*;', s) or re.search(r'\bWebView\s+(\w+)\s*=', s)
          if not m:
              raise SystemExit("Could not detect WebView variable")
          wv = m.group(1)

          # Native bridge: accepts data URLs from JS and saves them using MediaStore.
          anchor = re.search(r'^\s*'+re.escape(wv)+r'\.loadUrl\([^;]+\);\s*$', s, flags=re.M)
          if not anchor:
              raise SystemExit("Could not find loadUrl")

          native = r'''
                  // SHAMNA_FILE_BRIDGE_V3
                  __WEBVIEW__.addJavascriptInterface(new Object() {
                      private android.net.Uri saveBytes(byte[] bytes, String suggestedName, String mime) throws Exception {
                          String safeMime = (mime == null || mime.trim().isEmpty()) ? "application/octet-stream" : mime.trim();
                          String ext = android.webkit.MimeTypeMap.getSingleton().getExtensionFromMimeType(safeMime);
                          String name = (suggestedName == null || suggestedName.trim().isEmpty())
                              ? ("Shamna-AI-" + System.currentTimeMillis()) : suggestedName.trim();
                          name = name.replaceAll("[\\\\/:*?\\"<>|]", "_");
                          if (ext != null && !ext.isEmpty() && !name.toLowerCase(java.util.Locale.ROOT).endsWith("." + ext.toLowerCase(java.util.Locale.ROOT))) {
                              name += "." + ext;
                          }

                          android.content.ContentResolver resolver = getContentResolver();
                          android.content.ContentValues values = new android.content.ContentValues();
                          values.put(android.provider.MediaStore.MediaColumns.DISPLAY_NAME, name);
                          values.put(android.provider.MediaStore.MediaColumns.MIME_TYPE, safeMime);
                          values.put(android.provider.MediaStore.MediaColumns.RELATIVE_PATH, android.os.Environment.DIRECTORY_DOWNLOADS + "/Shamna AI");
                          values.put(android.provider.MediaStore.MediaColumns.IS_PENDING, 1);

                          android.net.Uri uri = resolver.insert(android.provider.MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                          if (uri == null) throw new java.io.IOException("insert failed");
                          try (java.io.OutputStream out = resolver.openOutputStream(uri)) {
                              if (out == null) throw new java.io.IOException("stream failed");
                              out.write(bytes);
                              out.flush();
                          }
                          values.clear();
                          values.put(android.provider.MediaStore.MediaColumns.IS_PENDING, 0);
                          resolver.update(uri, values, null, null);
                          return uri;
                      }

                      private void openUri(android.net.Uri uri, String mime) {
                          try {
                              android.content.Intent v = new android.content.Intent(android.content.Intent.ACTION_VIEW);
                              v.setDataAndType(uri, (mime == null || mime.isEmpty()) ? "*/*" : mime);
                              v.addFlags(android.content.Intent.FLAG_GRANT_READ_URI_PERMISSION);
                              android.content.Intent chooser = android.content.Intent.createChooser(v, "فتح الملف باستخدام");
                              chooser.addFlags(android.content.Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(chooser);
                          } catch (Exception e) {
                              android.widget.Toast.makeText(MainActivity.this, "تم حفظ الملف في التنزيلات", android.widget.Toast.LENGTH_LONG).show();
                          }
                      }

                      @android.webkit.JavascriptInterface
                      public void saveDataUrl(String dataUrl, String name, String mime, boolean openAfter) {
                          try {
                              if (dataUrl == null || !dataUrl.startsWith("data:")) throw new IllegalArgumentException("bad data url");
                              int comma = dataUrl.indexOf(',');
                              if (comma < 0) throw new IllegalArgumentException("bad data url");
                              String header = dataUrl.substring(0, comma);
                              String payload = dataUrl.substring(comma + 1);
                              String realMime = mime;
                              if (realMime == null || realMime.isEmpty()) {
                                  int c = header.indexOf(':');
                                  int sc = header.indexOf(';');
                                  if (c >= 0 && sc > c) realMime = header.substring(c + 1, sc);
                              }
                              if (realMime == null || realMime.isEmpty()) realMime = "application/octet-stream";
                              byte[] bytes = header.contains(";base64")
                                  ? android.util.Base64.decode(payload, android.util.Base64.DEFAULT)
                                  : java.net.URLDecoder.decode(payload, "UTF-8").getBytes(java.nio.charset.StandardCharsets.UTF_8);
                              final String fm = realMime;
                              final android.net.Uri uri = saveBytes(bytes, name, fm);
                              runOnUiThread(() -> {
                                  android.widget.Toast.makeText(MainActivity.this, "تم حفظ الملف في التنزيلات", android.widget.Toast.LENGTH_SHORT).show();
                                  if (openAfter) openUri(uri, fm);
                              });
                          } catch (Exception e) {
                              runOnUiThread(() -> android.widget.Toast.makeText(MainActivity.this, "تعذر تنزيل الملف", android.widget.Toast.LENGTH_LONG).show());
                          }
                      }

                      @android.webkit.JavascriptInterface
                      public void openBrowser(String url) {
                          if (url == null || url.isEmpty()) return;
                          runOnUiThread(() -> {
                              try {
                                  android.content.Intent i = new android.content.Intent(android.content.Intent.ACTION_VIEW, android.net.Uri.parse(url));
                                  i.addCategory(android.content.Intent.CATEGORY_BROWSABLE);
                                  startActivity(i);
                              } catch (Exception e) {
                                  android.widget.Toast.makeText(MainActivity.this, "تعذر فتح المتصفح", android.widget.Toast.LENGTH_LONG).show();
                              }
                          });
                      }
                  }, "ShamnaNative");

                  __WEBVIEW__.setDownloadListener((url, userAgent, contentDisposition, mimeType, contentLength) -> {
                      try {
                          if (url == null) return;
                          if (url.startsWith("blob:") || url.startsWith("data:")) {
                              String qu = org.json.JSONObject.quote(url);
                              String qn = org.json.JSONObject.quote(android.webkit.URLUtil.guessFileName(url, contentDisposition, mimeType));
                              String qm = org.json.JSONObject.quote(mimeType == null ? "" : mimeType);
                              String js = "(async()=>{try{let u=" + qu + ",d=u,m=" + qm + ";if(u.startsWith('blob:')){let r=await fetch(u),b=await r.blob();m=m||b.type||'';d=await new Promise((ok,no)=>{let f=new FileReader();f.onload=()=>ok(f.result);f.onerror=no;f.readAsDataURL(b);});}ShamnaNative.saveDataUrl(d,"+qn+",m,false);}catch(e){console.error(e)})();";
                              __WEBVIEW__.evaluateJavascript(js, null);
                              return;
                          }
                          android.app.DownloadManager.Request req = new android.app.DownloadManager.Request(android.net.Uri.parse(url));
                          if (mimeType != null && !mimeType.isEmpty()) req.setMimeType(mimeType);
                          if (userAgent != null) req.addRequestHeader("User-Agent", userAgent);
                          String cookie = android.webkit.CookieManager.getInstance().getCookie(url);
                          if (cookie != null) req.addRequestHeader("Cookie", cookie);
                          String filename = android.webkit.URLUtil.guessFileName(url, contentDisposition, mimeType);
                          req.setTitle(filename);
                          req.setNotificationVisibility(android.app.DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                          req.setDestinationInExternalPublicDir(android.os.Environment.DIRECTORY_DOWNLOADS, "Shamna AI/" + filename);
                          ((android.app.DownloadManager)getSystemService(DOWNLOAD_SERVICE)).enqueue(req);
                          android.widget.Toast.makeText(MainActivity.this, "بدأ التنزيل", android.widget.Toast.LENGTH_SHORT).show();
                      } catch (Exception e) {
                          android.widget.Toast.makeText(MainActivity.this, "تعذر تنزيل الملف", android.widget.Toast.LENGTH_LONG).show();
                      }
                  });
          '''
          native = native.replace("__WEBVIEW__", wv)
          s = s[:anchor.end()] + "\n" + native + s[anchor.end():]

          # Force any new-window navigation to external browser.
          if "SHAMNA_CHROME_EXTERNAL_V3" not in s:
              chrome_anchor = re.search(r'\b'+re.escape(wv)+r'\.setWebChromeClient\s*\(new\s+WebChromeClient\s*\(\)\s*\{', s)
              if chrome_anchor:
                  pos = chrome_anchor.end()
                  method = r'''
                      // SHAMNA_CHROME_EXTERNAL_V3
                      @Override
                      public boolean onCreateWindow(WebView view, boolean isDialog, boolean isUserGesture, android.os.Message resultMsg) {
                          try {
                              WebView.HitTestResult hit = view.getHitTestResult();
                              String url = hit != null ? hit.getExtra() : null;
                              if (url != null && (url.startsWith("http://") || url.startsWith("https://"))) {
                                  android.content.Intent i = new android.content.Intent(android.content.Intent.ACTION_VIEW, android.net.Uri.parse(url));
                                  i.addCategory(android.content.Intent.CATEGORY_BROWSABLE);
                                  startActivity(i);
                                  return false;
                              }
                          } catch (Exception ignored) {}
                          return false;
                      }
                  '''
                  s = s[:pos] + "\n" + method + s[pos:]

          # Inject aggressive page-level interception on every finished load.
          js = r"""
          (function(){
            if(window.__shamnaNativeV3) return;
            window.__shamnaNativeV3=true;

            const blobMap=new Map();
            try{
              const c=URL.createObjectURL.bind(URL);
              URL.createObjectURL=function(obj){const u=c(obj);blobMap.set(u,obj);return u;};
            }catch(_){}

            function isExternal(u){
              try{
                const x=new URL(u,location.href);
                return (x.protocol==='http:'||x.protocol==='https:') && x.hostname!=='perchance.org' && !x.hostname.endsWith('.perchance.org');
              }catch(_){return false;}
            }

            async function asData(u){
              if(u.startsWith('data:')) return {data:u,mime:(u.match(/^data:([^;,]+)/)||[])[1]||''};
              let b=blobMap.get(u);
              if(!b){const r=await fetch(u);b=await r.blob();}
              const data=await new Promise((ok,no)=>{const f=new FileReader();f.onload=()=>ok(f.result);f.onerror=no;f.readAsDataURL(b);});
              return {data,mime:b.type||''};
            }

            function nameFor(mime,preferred){
              if(preferred) return preferred;
              let e='';
              if(mime==='application/pdf')e='.pdf';
              else if(mime==='image/png')e='.png';
              else if(mime==='image/jpeg')e='.jpg';
              else if(mime==='image/webp')e='.webp';
              return 'Shamna-AI-'+Date.now()+e;
            }

            async function nativeSave(url, preferred, mime, openAfter){
              try{
                const x=await asData(url);
                ShamnaNative.saveDataUrl(x.data,nameFor(mime||x.mime,preferred),mime||x.mime,!!openAfter);
                return true;
              }catch(e){console.error('nativeSave',e);return false;}
            }

            function findFileUrl(root){
              let el=root;
              for(let i=0;i<8 && el;i++,el=el.parentElement){
                const nodes=[el].concat(Array.from(el.querySelectorAll ? el.querySelectorAll('a,img,object,embed,source') : []));
                for(const n of nodes){
                  const vals=[
                    n.href,n.src,n.data,
                    n.getAttribute&&n.getAttribute('href'),
                    n.getAttribute&&n.getAttribute('src'),
                    n.getAttribute&&n.getAttribute('data'),
                    n.getAttribute&&n.getAttribute('data-url'),
                    n.getAttribute&&n.getAttribute('data-download'),
                    n.getAttribute&&n.getAttribute('data-src')
                  ].filter(Boolean);
                  for(const v of vals){
                    if(typeof v==='string' && (v.startsWith('blob:')||v.startsWith('data:'))) return v;
                  }
                }
              }
              if(blobMap.size) return Array.from(blobMap.keys()).pop();
              return '';
            }

            // All ordinary links supplied in answers go to the real browser.
            document.addEventListener('click',function(e){
              const a=e.target && e.target.closest ? e.target.closest('a') : null;
              if(a){
                const href=a.href||a.getAttribute('href')||'';
                if(isExternal(href)){
                  e.preventDefault(); e.stopImmediatePropagation();
                  ShamnaNative.openBrowser(href);
                  return;
                }
                if(href.startsWith('blob:')||href.startsWith('data:')){
                  e.preventDefault(); e.stopImmediatePropagation();
                  const txt=(a.textContent||'').trim();
                  nativeSave(href,a.getAttribute('download')||'', '', /فتح|open/i.test(txt));
                  return;
                }
              }

              const b=e.target && e.target.closest ? e.target.closest('button,[role="button"],a') : null;
              if(!b) return;
              const txt=(b.textContent||'').replace(/\s+/g,' ').trim();
              if(/تحميل|تنزيل|download|حفظ/i.test(txt) || /فتح|open/i.test(txt)){
                const u=findFileUrl(b);
                if(u){
                  e.preventDefault(); e.stopImmediatePropagation();
                  const openAfter=/فتح|open/i.test(txt) && !/تحميل|تنزيل|download|حفظ/i.test(txt);
                  const mime=/pdf/i.test(txt)?'application/pdf':(/صورة|image/i.test(txt)?'image/png':'');
                  nativeSave(u,'',mime,openAfter);
                }
              }
            },true);

            // Catch script-driven links too.
            const oldOpen=window.open;
            window.open=function(url,target,features){
              if(typeof url==='string'){
                if(isExternal(url)){ShamnaNative.openBrowser(url);return null;}
                if(url.startsWith('blob:')||url.startsWith('data:')){nativeSave(url,'','',true);return null;}
              }
              return oldOpen ? oldOpen.call(window,url,target,features) : null;
            };

            const oldAnchorClick=HTMLAnchorElement.prototype.click;
            HTMLAnchorElement.prototype.click=function(){
              const href=this.href||this.getAttribute('href')||'';
              if(isExternal(href)){ShamnaNative.openBrowser(href);return;}
              if(href.startsWith('blob:')||href.startsWith('data:')){
                nativeSave(href,this.getAttribute('download')||'','',false);return;
              }
              return oldAnchorClick.call(this);
            };
          })();
          """
          jlit=json.dumps(js,ensure_ascii=False)
          marker="                progressBar.setVisibility(View.GONE);"
          if marker not in s:
              raise SystemExit("onPageFinished marker missing")
          s=s.replace(marker, marker + "\n                  view.evaluateJavascript(" + jlit + ", null);", 1)

          # Native WebViewClient fallback for normal navigations.
          if "SHAMNA_NATIVE_EXTERNAL_V3" not in s:
              pos=s.find("            @Override\n            public void onPageFinished")
              if pos < 0: pos=s.find("        @Override\n        public void onPageFinished")
              if pos < 0: raise SystemExit("WebViewClient insertion point missing")
              overload=r'''
                // SHAMNA_NATIVE_EXTERNAL_V3
                @Override
                public boolean shouldOverrideUrlLoading(WebView view, android.webkit.WebResourceRequest request) {
                    android.net.Uri u=request.getUrl();
                    if(u==null) return false;
                    String scheme=u.getScheme()==null?"":u.getScheme().toLowerCase(java.util.Locale.ROOT);
                    String host=u.getHost()==null?"":u.getHost().toLowerCase(java.util.Locale.ROOT);
                    if(("http".equals(scheme)||"https".equals(scheme)) && !(host.equals("perchance.org")||host.endsWith(".perchance.org"))){
                        try{
                            android.content.Intent i=new android.content.Intent(android.content.Intent.ACTION_VIEW,u);
                            i.addCategory(android.content.Intent.CATEGORY_BROWSABLE);
                            startActivity(i);
                            return true;
                        }catch(Exception ignored){}
                    }
                    return false;
                }

                @Override
                public boolean shouldOverrideUrlLoading(WebView view, String url) {
                    try{
                        android.net.Uri u=android.net.Uri.parse(url);
                        String scheme=u.getScheme()==null?"":u.getScheme().toLowerCase(java.util.Locale.ROOT);
                        String host=u.getHost()==null?"":u.getHost().toLowerCase(java.util.Locale.ROOT);
                        if(("http".equals(scheme)||"https".equals(scheme)) && !(host.equals("perchance.org")||host.endsWith(".perchance.org"))){
                            android.content.Intent i=new android.content.Intent(android.content.Intent.ACTION_VIEW,u);
                            i.addCategory(android.content.Intent.CATEGORY_BROWSABLE);
                            startActivity(i);
                            return true;
                        }
                    }catch(Exception ignored){}
                    return false;
                }
              '''
              s=s[:pos]+overload+"\n"+s[pos:]

          p.write_text(s,encoding="utf-8")
          print("Robust download/open/external-browser handling applied")
          PY

      - name: Verify project files
        shell: bash
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          echo "Required Android project files found"

      - name: Build debug APK
        shell: bash
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK exists
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK was not generated"
            find app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

      - name: Rename APK
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Shamna-AI.apk
          ls -lh Shamna-AI.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shamna-AI-APK
          path: Shamna-AI.apk
          if-no-files-found: error
          retention-days: 30
