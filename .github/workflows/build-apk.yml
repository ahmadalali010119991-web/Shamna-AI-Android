name: Build Shamna AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            echo "sdkmanager not found at expected path:"
            echo "$SDKMANAGER"
            echo "ANDROID_HOME=$ANDROID_HOME"
            find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -20
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Shamna AI project
        shell: bash
        run: |
          unzip -o Shamna_AI_Android_Project.zip
          echo "Project extracted"
          ls -la
          ls -la app

      - name: Fix Android permission code
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/java/com/shamna/ai/MainActivity.java")

          if not p.exists():
              raise SystemExit(f"MainActivity.java not found: {p}")

          s = p.read_text(encoding="utf-8")

          s = s.replace(
              "checkSelfPermission(MainActivity.this, Manifest.permission.CAMERA)",
              "checkSelfPermission(Manifest.permission.CAMERA)"
          )

          s = s.replace(
              "checkSelfPermission(MainActivity.this, Manifest.permission.RECORD_AUDIO)",
              "checkSelfPermission(Manifest.permission.RECORD_AUDIO)"
          )

          p.write_text(s, encoding="utf-8")

          print("MainActivity.java updated successfully")
          PY


      - name: Fix Android safe areas
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/src/main/java/com/shamna/ai/MainActivity.java")
          s = p.read_text(encoding="utf-8")

          marker = "SHAMNA_SAFE_AREA_FIX"
          if marker not in s:
              code = r'''
                  // SHAMNA_SAFE_AREA_FIX
                  final android.view.View shamnaRoot = findViewById(android.R.id.content);
                  if (shamnaRoot != null) {
                      androidx.core.view.ViewCompat.setOnApplyWindowInsetsListener(
                          shamnaRoot,
                          (view, insets) -> {
                              androidx.core.graphics.Insets bars = insets.getInsets(
                                  androidx.core.view.WindowInsetsCompat.Type.systemBars()
                              );
                              view.setPadding(
                                  view.getPaddingLeft(),
                                  bars.top,
                                  view.getPaddingRight(),
                                  0
                              );
                              return insets;
                          }
                      );
                      androidx.core.view.ViewCompat.requestApplyInsets(shamnaRoot);
                  }

                  getWindow().setStatusBarColor(android.graphics.Color.rgb(4, 47, 31));
                  getWindow().setNavigationBarColor(android.graphics.Color.rgb(4, 47, 31));
              '''

              m = re.search(r'(^\s*setContentView\s*\([^;]+\);\s*$)', s, flags=re.M)
              if not m:
                  raise SystemExit("Could not find setContentView(...) in MainActivity.java")

              s = s[:m.end()] + "\n" + code + s[m.end():]

          p.write_text(s, encoding="utf-8")
          print("Safe-area fix applied successfully")
          PY

      - name: Verify project files
        shell: bash
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          echo "Required Android project files found"

      - name: Build debug APK
        shell: bash
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK exists
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK was not generated"
            find app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

      - name: Rename APK
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Shamna-AI.apk
          ls -lh Shamna-AI.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shamna-AI-APK
          path: Shamna-AI.apk
          if-no-files-found: error
          retention-days: 30
