              private final android.graphics.Paint fill = new android.graphics.Paint(android.graphics.Paint.ANTI_ALIAS_FLAG);
              private final android.graphics.Paint stroke = new android.graphics.Paint(android.graphics.Paint.ANTI_ALIAS_FLAG);
              private final android.graphics.Paint accent = new android.graphics.Paint(android.graphics.Paint.ANTI_ALIAS_FLAG);
              private final android.graphics.Path path = new android.graphics.Path();

              public GoldCornerView(android.content.Context context, int corner) {
                  super(context);
                  this.corner = corner;
                  setClickable(true);
                  setFocusable(false);
                  setElevation(dp(1000));
                  stroke.setStyle(android.graphics.Paint.Style.STROKE);
                  stroke.setStrokeWidth(dp(1.4f));
                  stroke.setColor(android.graphics.Color.rgb(255, 224, 112));
                  accent.setStyle(android.graphics.Paint.Style.STROKE);
                  accent.setStrokeWidth(dp(0.8f));
                  accent.setColor(android.graphics.Color.argb(170, 255, 239, 168));
              }

              private float dp(float v) {
                  return v * getResources().getDisplayMetrics().density;
              }

              // Only the painted triangle itself blocks touches. The transparent
              // half of this square remains fully touch-through to the WebView.
              private boolean isInsideTriangle(float x, float y) {
                  final float w = getWidth();
                  final float h = getHeight();
                  if (w <= 0 || h <= 0) return false;

                  switch (corner) {
                      case TOP_LEFT:
                          return (x / w) + (y / h) <= 1f;
                      case TOP_RIGHT:
                          return ((w - x) / w) + (y / h) <= 1f;
                      case BOTTOM_LEFT:
                          return (x / w) + ((h - y) / h) <= 1f;
                      default:
                          return ((w - x) / w) + ((h - y) / h) <= 1f;
                  }
              }

              @Override
              public boolean dispatchTouchEvent(android.view.MotionEvent event) {
                  if (!isInsideTriangle(event.getX(), event.getY())) {
                      return false;
                  }
                  return super.dispatchTouchEvent(event);
              }

              @Override
              public boolean onTouchEvent(android.view.MotionEvent event) {
                  return isInsideTriangle(event.getX(), event.getY());
              }

              @Override
              protected void onDraw(android.graphics.Canvas canvas) {
                  super.onDraw(canvas);
                  final float w = getWidth();
                  final float h = getHeight();
                  path.reset();

                  switch (corner) {
                      case TOP_LEFT:
                          path.moveTo(0, 0);
                          path.lineTo(w, 0);
                          path.lineTo(0, h);
                          path.close();
                          break;
                      case TOP_RIGHT:
                          path.moveTo(0, 0);
                          path.lineTo(w, 0);
                          path.lineTo(w, h);
                          path.close();
                          break;
                      case BOTTOM_LEFT:
                          path.moveTo(0, 0);
                          path.lineTo(0, h);
                          path.lineTo(w, h);
                          path.close();
                          break;
                      default:
                          path.moveTo(w, 0);
                          path.lineTo(w, h);
                          path.lineTo(0, h);
                          path.close();
                          break;
                  }

                  float x0 = (corner == TOP_RIGHT || corner == BOTTOM_RIGHT) ? w : 0;
                  float y0 = (corner == BOTTOM_LEFT || corner == BOTTOM_RIGHT) ? h : 0;
                  float x1 = (corner == TOP_RIGHT || corner == BOTTOM_RIGHT) ? 0 : w;
                  float y1 = (corner == BOTTOM_LEFT || corner == BOTTOM_RIGHT) ? 0 : h;

                  fill.setShader(new android.graphics.LinearGradient(
                      x0, y0, x1, y1,
                      new int[] {
                          android.graphics.Color.rgb(255, 237, 154),
                          android.graphics.Color.rgb(232, 184, 59),
                          android.graphics.Color.rgb(173, 111, 11),
                          android.graphics.Color.rgb(245, 202, 76)
                      },
                      new float[] {0f, 0.28f, 0.72f, 1f},
                      android.graphics.Shader.TileMode.CLAMP
                  ));

                  canvas.drawPath(path, fill);
                  fill.setShader(null);
                  canvas.drawPath(path, stroke);

                  // Fine metallic highlight lines parallel to the outer edges.
                  android.graphics.Path p2 = new android.graphics.Path();
                  final float inset = dp(3.2f);
                  switch (corner) {
                      case TOP_LEFT:
                          p2.moveTo(inset, inset);
                          p2.lineTo(w - inset * 1.5f, inset);
                          p2.moveTo(inset, inset);
                          p2.lineTo(inset, h - inset * 1.5f);
                          break;
                      case TOP_RIGHT:
                          p2.moveTo(inset * 1.5f, inset);
                          p2.lineTo(w - inset, inset);
                          p2.moveTo(w - inset, inset);
                          p2.lineTo(w - inset, h - inset * 1.5f);
                          break;
                      case BOTTOM_LEFT:
                          p2.moveTo(inset, inset * 1.5f);
                          p2.lineTo(inset, h - inset);
                          p2.moveTo(inset, h - inset);
                          p2.lineTo(w - inset * 1.5f, h - inset);
                          break;
                      default:
                          p2.moveTo(w - inset, inset * 1.5f);
                          p2.lineTo(w - inset, h - inset);
                          p2.moveTo(inset * 1.5f, h - inset);
                          p2.lineTo(w - inset, h - inset);
                          break;
                  }
                  canvas.drawPath(p2, accent);
              }
          }
          JAVA

