name: Build Shamna AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            echo "sdkmanager not found at expected path:"
            echo "$SDKMANAGER"
            echo "ANDROID_HOME=$ANDROID_HOME"
            find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -20
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Shamna AI project
        shell: bash
        run: |
          unzip -o Shamna_AI_Android_Project.zip
          echo "Project extracted"
          ls -la
          ls -la app

      - name: Fix Android permission code
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/java/com/shamna/ai/MainActivity.java")

          if not p.exists():
              raise SystemExit(f"MainActivity.java not found: {p}")

          s = p.read_text(encoding="utf-8")

          s = s.replace(
              "checkSelfPermission(MainActivity.this, Manifest.permission.CAMERA)",
              "checkSelfPermission(Manifest.permission.CAMERA)"
          )

          s = s.replace(
              "checkSelfPermission(MainActivity.this, Manifest.permission.RECORD_AUDIO)",
              "checkSelfPermission(Manifest.permission.RECORD_AUDIO)"
          )

          p.write_text(s, encoding="utf-8")

          print("MainActivity.java updated successfully")
          PY


      - name: Fix Android safe areas
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/src/main/java/com/shamna/ai/MainActivity.java")
          s = p.read_text(encoding="utf-8")

          marker = "SHAMNA_SAFE_AREA_FIX"
          if marker not in s:
              code = r'''
                  // SHAMNA_SAFE_AREA_FIX
                  final android.view.View shamnaRoot = findViewById(android.R.id.content);
                  if (shamnaRoot != null && android.os.Build.VERSION.SDK_INT >= 20) {
                      shamnaRoot.setOnApplyWindowInsetsListener((view, insets) -> {
                          int topInset = insets.getSystemWindowInsetTop();
                          view.setPadding(
                              view.getPaddingLeft(),
                              topInset,
                              view.getPaddingRight(),
                              0
                          );
                          return insets;
                      });
                      shamnaRoot.requestApplyInsets();
                  }

                  getWindow().setStatusBarColor(android.graphics.Color.rgb(4, 47, 31));
                  getWindow().setNavigationBarColor(android.graphics.Color.rgb(4, 47, 31));
              '''

              m = re.search(r'(^\s*setContentView\s*\([^;]+\);\s*$)', s, flags=re.M)
              if not m:
                  raise SystemExit("Could not find setContentView(...) in MainActivity.java")

              s = s[:m.end()] + "\n" + code + s[m.end():]

          p.write_text(s, encoding="utf-8")
          print("Safe-area fix applied successfully")
          PY

      - name: Fix keyboard chat UX
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          p = Path("app/src/main/java/com/shamna/ai/MainActivity.java")
          s = p.read_text(encoding="utf-8")

          # Ensure the activity always resizes for the soft keyboard.
          if "SHAMNA_KEYBOARD_RESIZE" not in s:
              m = re.search(r'(^\s*setContentView\s*\([^;]+\);\s*$)', s, flags=re.M)
              if not m:
                  raise SystemExit("Could not find setContentView(...)")
              native = """
                  // SHAMNA_KEYBOARD_RESIZE
                  getWindow().setSoftInputMode(
                      android.view.WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE
                      | android.view.WindowManager.LayoutParams.SOFT_INPUT_STATE_ALWAYS_HIDDEN
                  );
              """
              s = s[:m.end()] + "\n" + native + s[m.end():]

          # Inject a compact mobile layout fix after each page finishes loading.
          if "SHAMNA_KEYBOARD_WEB_FIX" not in s:
              js = r"""
          (function(){
            if (window.__shamnaKeyboardFixInstalled) {
              if (window.__shamnaApplyViewportFix) window.__shamnaApplyViewportFix();
              return;
            }
            window.__shamnaKeyboardFixInstalled = true;

            var style = document.createElement('style');
            style.id = 'shamna-keyboard-fix';
            style.textContent = [
              'html,body{margin:0!important;max-width:100%!important;}',
              'html{height:var(--shamna-vh,100dvh)!important;overflow:hidden!important;}',
              'body{height:var(--shamna-vh,100dvh)!important;min-height:0!important;overflow:hidden!important;}',
              'body>div:first-of-type{height:var(--shamna-vh,100dvh)!important;min-height:0!important;max-height:var(--shamna-vh,100dvh)!important;}',
              'header,[role="banner"],[class*="header" i],[class*="topbar" i],[class*="top-bar" i]{flex-shrink:0!important;z-index:99999!important;}',
              '[class*="messages" i],[class*="conversation" i],[class*="chat" i],[class*="history" i]{min-height:0!important;overflow-y:auto!important;overscroll-behavior-y:contain!important;-webkit-overflow-scrolling:touch!important;}',
              'textarea,input,[contenteditable="true"]{scroll-margin-top:88px!important;scroll-margin-bottom:110px!important;}'
            ].join('');

            (document.head || document.documentElement).appendChild(style);

            function makeLikelyChatScrollable(){
              var all = document.querySelectorAll('div,main,section');
              for (var i=0;i<all.length;i++){
                var el=all[i];
                var cs=getComputedStyle(el);
                var r=el.getBoundingClientRect();
                if (r.height>120 && r.width>200 && (cs.overflowY==='hidden' || cs.overflowY==='clip')) {
                  if (el.scrollHeight > el.clientHeight + 24) {
                    el.style.setProperty('overflow-y','auto','important');
                    el.style.setProperty('min-height','0','important');
                    el.style.setProperty('overscroll-behavior-y','contain','important');
                    el.style.setProperty('-webkit-overflow-scrolling','touch','important');
                  }
                }
              }
            }

            function keepTopBarVisible(){
              var els = document.querySelectorAll('header,nav,div');
              for (var i=0;i<els.length;i++){
                var el=els[i], txt=(el.innerText||'').trim(), r=el.getBoundingClientRect();
                if (txt.indexOf('Shamna AI')!==-1 && r.height>35 && r.height<140 && r.width>220) {
                  var buttons=el.querySelectorAll('button,a,[role="button"]');
                  if (buttons.length>=2 && r.top<160) {
                    el.style.setProperty('position','sticky','important');
                    el.style.setProperty('top','0','important');
                    el.style.setProperty('z-index','2147483000','important');
                    el.style.setProperty('flex-shrink','0','important');
                    break;
                  }
                }
              }
            }

            function applyViewportFix(){
              var vv=window.visualViewport;
              var h=Math.round(vv ? vv.height : window.innerHeight);
              if(h<200) h=window.innerHeight;
              document.documentElement.style.setProperty('--shamna-vh',h+'px');
              makeLikelyChatScrollable();
              keepTopBarVisible();
            }

            window.__shamnaApplyViewportFix=applyViewportFix;
            applyViewportFix();

            if(window.visualViewport){
              visualViewport.addEventListener('resize',function(){
                applyViewportFix();
                setTimeout(applyViewportFix,80);
                setTimeout(applyViewportFix,250);
              });
              visualViewport.addEventListener('scroll',applyViewportFix);
            }
            window.addEventListener('resize',applyViewportFix);

            document.addEventListener('focusin',function(e){
              var t=e.target;
              if(!t) return;
              var tag=(t.tagName||'').toLowerCase();
              if(tag==='textarea' || tag==='input' || t.isContentEditable){
                setTimeout(function(){
                  applyViewportFix();
                  try{t.scrollIntoView({block:'nearest',inline:'nearest',behavior:'auto'});}catch(_){}
                },180);
              }
            },true);

            document.addEventListener('focusout',function(){
              setTimeout(applyViewportFix,180);
            },true);

            new MutationObserver(function(){setTimeout(applyViewportFix,30);})
              .observe(document.documentElement,{childList:true,subtree:true});
          })();
              """
              java_literal = json.dumps(js, ensure_ascii=False)

              old = "                progressBar.setVisibility(View.GONE);"
              if old not in s:
                  raise SystemExit("Could not find onPageFinished progress line")
              replacement = old + """
                  // SHAMNA_KEYBOARD_WEB_FIX
                  view.evaluateJavascript(""" + java_literal + """, null);"""
              s = s.replace(old, replacement, 1)

          p.write_text(s, encoding="utf-8")
          print("Keyboard/chat UX fix applied successfully")
          PY

      - name: Fix WebView downloads
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json

          p = Path("app/src/main/java/com/shamna/ai/MainActivity.java")
          s = p.read_text(encoding="utf-8")

          # Load the actual generator directly inside the Android WebView.
          # This avoids the cross-origin iframe wrapper, so generated blob/data files
          # can be handled reliably by the native app.
          s = s.replace("https://shamna-ai.vercel.app", "https://perchance.org/shamna-ai")

          # Detect WebView variable.
          m = re.search(r'\bWebView\s+(\w+)\s*;', s) or re.search(r'\bWebView\s+(\w+)\s*=', s)
          if not m:
              raise SystemExit("Could not detect WebView variable name")
          wv = m.group(1)

          # Remove any previous download bridge/listener patch if present by rebuilding
          # from the original extracted source each workflow run; the source zip itself
          # is unchanged, so this block is applied once per build.
          if "SHAMNA_DOWNLOAD_FIX_V2" not in s:
              anchor = re.search(r'^\s*'+re.escape(wv)+r'\.loadUrl\([^;]+\);\s*$', s, flags=re.M)
              if not anchor:
                  raise SystemExit("Could not find WebView loadUrl(...)")

              native = f'''
                  // SHAMNA_DOWNLOAD_FIX_V2
                  {wv}.addJavascriptInterface(new Object() {{
                      private android.net.Uri saveBytes(byte[] bytes, String suggestedName, String mimeType) throws Exception {{
                          String safeMime = (mimeType == null || mimeType.trim().isEmpty())
                              ? "application/octet-stream" : mimeType.trim();

                          String ext = android.webkit.MimeTypeMap.getSingleton().getExtensionFromMimeType(safeMime);
                          String name = (suggestedName == null || suggestedName.trim().isEmpty())
                              ? "Shamna-AI-file" : suggestedName.trim();

                          name = name.replaceAll("[\\\\/:*?\\"<>|]", "_");

                          if (ext != null && !ext.isEmpty() &&
                              !name.toLowerCase(java.util.Locale.ROOT).endsWith("." + ext.toLowerCase(java.util.Locale.ROOT))) {{
                              name += "." + ext;
                          }}

                          android.content.ContentResolver resolver = getContentResolver();

                          if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.Q) {{
                              android.content.ContentValues values = new android.content.ContentValues();
                              values.put(android.provider.MediaStore.MediaColumns.DISPLAY_NAME, name);
                              values.put(android.provider.MediaStore.MediaColumns.MIME_TYPE, safeMime);
                              values.put(android.provider.MediaStore.MediaColumns.RELATIVE_PATH, android.os.Environment.DIRECTORY_DOWNLOADS + "/Shamna AI");
                              values.put(android.provider.MediaStore.MediaColumns.IS_PENDING, 1);

                              android.net.Uri uri = resolver.insert(
                                  android.provider.MediaStore.Downloads.EXTERNAL_CONTENT_URI, values
                              );
                              if (uri == null) throw new java.io.IOException("Unable to create download");

                              try (java.io.OutputStream out = resolver.openOutputStream(uri)) {{
                                  if (out == null) throw new java.io.IOException("Unable to open output stream");
                                  out.write(bytes);
                                  out.flush();
                              }}

                              values.clear();
                              values.put(android.provider.MediaStore.MediaColumns.IS_PENDING, 0);
                              resolver.update(uri, values, null, null);
                              return uri;
                          }} else {{
                              java.io.File dir = android.os.Environment.getExternalStoragePublicDirectory(
                                  android.os.Environment.DIRECTORY_DOWNLOADS
                              );
                              if (!dir.exists()) dir.mkdirs();
                              java.io.File outFile = new java.io.File(dir, name);
                              try (java.io.FileOutputStream out = new java.io.FileOutputStream(outFile)) {{
                                  out.write(bytes);
                                  out.flush();
                              }}
                              android.media.MediaScannerConnection.scanFile(
                                  MainActivity.this,
                                  new String[]{{outFile.getAbsolutePath()}},
                                  new String[]{{safeMime}},
                                  null
                              );
                              return android.net.Uri.fromFile(outFile);
                          }}
                      }}

                      private void openSaved(android.net.Uri uri, String mimeType) {{
                          try {{
                              android.content.Intent intent = new android.content.Intent(android.content.Intent.ACTION_VIEW);
                              intent.setDataAndType(uri, mimeType == null || mimeType.isEmpty() ? "*/*" : mimeType);
                              intent.addFlags(android.content.Intent.FLAG_GRANT_READ_URI_PERMISSION);
                              intent.addFlags(android.content.Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(intent);
                          }} catch (Exception ex) {{
                              android.widget.Toast.makeText(
                                  MainActivity.this,
                                  "تم حفظ الملف في التنزيلات",
                                  android.widget.Toast.LENGTH_LONG
                              ).show();
                          }}
                      }}

                      @android.webkit.JavascriptInterface
                      public void saveDataUrl(String dataUrl, String suggestedName, String mimeType, boolean openAfter) {{
                          try {{
                              if (dataUrl == null || !dataUrl.startsWith("data:")) {{
                                  throw new IllegalArgumentException("Expected data URL");
                              }}
                              int comma = dataUrl.indexOf(',');
                              if (comma < 0) throw new IllegalArgumentException("Invalid data URL");

                              String header = dataUrl.substring(0, comma);
                              String payload = dataUrl.substring(comma + 1);

                              String actualMime = mimeType;
                              if (actualMime == null || actualMime.isEmpty()) {{
                                  int colon = header.indexOf(':');
                                  int semi = header.indexOf(';');
                                  if (colon >= 0 && semi > colon) actualMime = header.substring(colon + 1, semi);
                              }}
                              if (actualMime == null || actualMime.isEmpty()) actualMime = "application/octet-stream";

                              byte[] bytes;
                              if (header.contains(";base64")) {{
                                  bytes = android.util.Base64.decode(payload, android.util.Base64.DEFAULT);
                              }} else {{
                                  bytes = java.net.URLDecoder.decode(payload, "UTF-8").getBytes(java.nio.charset.StandardCharsets.UTF_8);
                              }}

                              android.net.Uri uri = saveBytes(bytes, suggestedName, actualMime);
                              final String toast = openAfter ? "تم حفظ الملف، جارٍ فتحه" : "تم حفظ الملف في التنزيلات";
                              runOnUiThread(() -> {{
                                  android.widget.Toast.makeText(MainActivity.this, toast, android.widget.Toast.LENGTH_SHORT).show();
                                  if (openAfter) openSaved(uri, actualMime);
                              }});
                          }} catch (Exception e) {{
                              runOnUiThread(() -> android.widget.Toast.makeText(
                                  MainActivity.this,
                                  "تعذر تنزيل الملف: " + e.getClass().getSimpleName(),
                                  android.widget.Toast.LENGTH_LONG
                              ).show());
                          }}
                      }}

                      @android.webkit.JavascriptInterface
                      public void openExternal(String url) {{
                          runOnUiThread(() -> {{
                              try {{
                                  android.content.Intent intent = new android.content.Intent(
                                      android.content.Intent.ACTION_VIEW,
                                      android.net.Uri.parse(url)
                                  );
                                  startActivity(intent);
                              }} catch (Exception e) {{
                                  android.widget.Toast.makeText(MainActivity.this, "تعذر فتح الرابط", android.widget.Toast.LENGTH_LONG).show();
                              }}
                          }});
                      }}
                  }}, "ShamnaNative");

                  {wv}.setDownloadListener((url, userAgent, contentDisposition, mimeType, contentLength) -> {{
                      try {{
                          if (url == null) return;

                          if (url.startsWith("blob:") || url.startsWith("data:")) {{
                              String qUrl = org.json.JSONObject.quote(url);
                              String qName = org.json.JSONObject.quote(
                                  android.webkit.URLUtil.guessFileName(url, contentDisposition, mimeType)
                              );
                              String qMime = org.json.JSONObject.quote(mimeType == null ? "" : mimeType);

                              String js =
                                  "(async()=>{{try{{" +
                                  "const u=" + qUrl + ";" +
                                  "let data=u, mime=" + qMime + ";" +
                                  "if(u.startsWith('blob:')){{" +
                                  " const r=await fetch(u); const b=await r.blob(); mime=mime||b.type||'';" +
                                  " data=await new Promise((res,rej)=>{{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(b);}});" +
                                  "}}" +
                                  "ShamnaNative.saveDataUrl(data," + qName + ",mime,false);" +
                                  "}}catch(e){{console.error(e);}}}})();";
                              {wv}.evaluateJavascript(js, null);
                              return;
                          }}

                          android.app.DownloadManager.Request req = new android.app.DownloadManager.Request(android.net.Uri.parse(url));
                          if (mimeType != null && !mimeType.isEmpty()) req.setMimeType(mimeType);
                          if (userAgent != null) req.addRequestHeader("User-Agent", userAgent);
                          String cookie = android.webkit.CookieManager.getInstance().getCookie(url);
                          if (cookie != null) req.addRequestHeader("Cookie", cookie);

                          String filename = android.webkit.URLUtil.guessFileName(url, contentDisposition, mimeType);
                          req.setTitle(filename);
                          req.setDescription("Shamna AI");
                          req.setNotificationVisibility(android.app.DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                          req.setDestinationInExternalPublicDir(
                              android.os.Environment.DIRECTORY_DOWNLOADS,
                              "Shamna AI/" + filename
                          );

                          android.app.DownloadManager dm =
                              (android.app.DownloadManager) getSystemService(DOWNLOAD_SERVICE);
                          dm.enqueue(req);
                          android.widget.Toast.makeText(MainActivity.this, "بدأ التنزيل", android.widget.Toast.LENGTH_SHORT).show();
                      }} catch (Exception e) {{
                          android.widget.Toast.makeText(
                              MainActivity.this,
                              "تعذر تنزيل الملف",
                              android.widget.Toast.LENGTH_LONG
                          ).show();
                      }}
                  }});
              '''

              s = s[:anchor.end()] + "\n" + native + s[anchor.end():]

              # Inject robust JS hooks into the generator page itself.
              js = r"""
          (function(){
            if(window.__shamnaDownloadV2Installed) return;
            window.__shamnaDownloadV2Installed=true;

            const blobs = new Map();
            const oldCreate = URL.createObjectURL.bind(URL);
            const oldRevoke = URL.revokeObjectURL.bind(URL);

            URL.createObjectURL = function(obj){
              const u = oldCreate(obj);
              try{ blobs.set(u,obj); }catch(_){}
              return u;
            };
            URL.revokeObjectURL = function(u){
              setTimeout(()=>blobs.delete(u),30000);
              return oldRevoke(u);
            };

            async function toDataUrl(url){
              if(url.startsWith('data:')) return {data:url,mime:(url.match(/^data:([^;,]+)/)||[])[1]||''};
              let b = blobs.get(url);
              if(!b){
                const r = await fetch(url);
                b = await r.blob();
              }
              const data = await new Promise((resolve,reject)=>{
                const fr=new FileReader();
                fr.onload=()=>resolve(fr.result);
                fr.onerror=reject;
                fr.readAsDataURL(b);
              });
              return {data,mime:b.type||''};
            }

            function guessName(url,mime,download){
              if(download && download !== 'true') return download;
              let ext = '';
              if(mime==='application/pdf') ext='.pdf';
              else if(mime==='image/png') ext='.png';
              else if(mime==='image/jpeg') ext='.jpg';
              else if(mime==='image/webp') ext='.webp';
              return 'Shamna-AI-'+Date.now()+ext;
            }

            async function send(url,name,mime,openAfter){
              try{
                if(!url) return false;
                if(url.startsWith('blob:')||url.startsWith('data:')){
                  const x=await toDataUrl(url);
                  ShamnaNative.saveDataUrl(x.data,name||guessName(url,x.mime,''),mime||x.mime,!!openAfter);
                  return true;
                }
                if(openAfter){
                  ShamnaNative.openExternal(url);
                  return true;
                }
              }catch(e){ console.error('Shamna native file error',e); }
              return false;
            }

            const oldOpen = window.open;
            window.open = function(url,target,features){
              try{
                if(typeof url==='string' && (url.startsWith('blob:')||url.startsWith('data:'))){
                  send(url,'Shamna-AI-'+Date.now(),'',true);
                  return null;
                }
              }catch(_){}
              return oldOpen ? oldOpen.call(window,url,target,features) : null;
            };

            const oldClick = HTMLAnchorElement.prototype.click;
            HTMLAnchorElement.prototype.click = function(){
              const href=this.href||this.getAttribute('href')||'';
              if(href.startsWith('blob:')||href.startsWith('data:')){
                send(href,guessName(href,'',this.getAttribute('download')||''),'',false);
                return;
              }
              return oldClick.call(this);
            };

            document.addEventListener('click',function(e){
              const a=e.target && e.target.closest ? e.target.closest('a') : null;
              if(a){
                const href=a.href||a.getAttribute('href')||'';
                if(href.startsWith('blob:')||href.startsWith('data:')){
                  e.preventDefault();
                  e.stopImmediatePropagation();
                  const label=(a.textContent||'').trim();
                  const openAfter=/فتح|open/i.test(label);
                  send(href,guessName(href,'',a.getAttribute('download')||''),'',openAfter);
                  return;
                }
              }

              // Fallback for generator buttons that don't use an <a> element.
              const el=e.target && e.target.closest ? e.target.closest('button,[role="button"]') : null;
              if(!el) return;
              const txt=(el.textContent||'').trim();

              if(/تحميل|تنزيل|download/i.test(txt)){
                let box=el;
                for(let i=0;i<6 && box;i++,box=box.parentElement){
                  const img=box.querySelector && box.querySelector('img');
                  if(img && img.src && (img.src.startsWith('blob:')||img.src.startsWith('data:'))){
                    e.preventDefault();
                    e.stopImmediatePropagation();
                    send(img.src,guessName(img.src,'image/png',''),'image/png',false);
                    return;
                  }
                }
                if(blobs.size){
                  const last=[...blobs.keys()].pop();
                  e.preventDefault();
                  e.stopImmediatePropagation();
                  send(last,'Shamna-AI-'+Date.now(),'',false);
                }
              } else if(/فتح|open/i.test(txt) && blobs.size){
                const last=[...blobs.keys()].pop();
                e.preventDefault();
                e.stopImmediatePropagation();
                send(last,'Shamna-AI-'+Date.now(),'',true);
              }
            },true);
          })();
              """

              java_js=json.dumps(js,ensure_ascii=False)
              marker="                progressBar.setVisibility(View.GONE);"
              if marker not in s:
                  raise SystemExit("Could not find onPageFinished marker")
              s=s.replace(marker, marker + "\n                  view.evaluateJavascript(" + java_js + ", null);", 1)

          p.write_text(s, encoding="utf-8")
          print("Direct generator load + robust downloads applied")
          PY

      - name: Verify project files
        shell: bash
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          echo "Required Android project files found"

      - name: Build debug APK
        shell: bash
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK exists
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK was not generated"
            find app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

      - name: Rename APK
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Shamna-AI.apk
          ls -lh Shamna-AI.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shamna-AI-APK
          path: Shamna-AI.apk
          if-no-files-found: error
          retention-days: 30
