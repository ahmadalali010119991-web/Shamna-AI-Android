          m = re.search(r'\\bWebView\\s+(\\w+)\\s*;', src) or re.search(r'\\bWebView\\s+(\\w+)\\s*=', src)
          if not m:
              raise SystemExit("WebView variable not found")
          wv = m.group(1)

          load = re.search(r'^\\s*'+re.escape(wv)+r'\\.loadUrl\\([^;]+\\);\\s*
        shell: bash
