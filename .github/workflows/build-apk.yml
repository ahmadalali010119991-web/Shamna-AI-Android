      - name: Fix location camera and microphone permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          mp = Path("app/src/main/AndroidManifest.xml")
          ms = mp.read_text(encoding="utf-8")
          permissions = [
              '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />',
              '<uses-permission android:name="android.permission.CAMERA" />',
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />'
          ]
          manifest_open = ms.find(">")
          if manifest_open < 0:
              raise SystemExit("Invalid AndroidManifest.xml")
          for perm in permissions:
              if perm not in ms:
                  ms = ms[:manifest_open+1] + "\n    " + perm + ms[manifest_open+1:]
          mp.write_text(ms, encoding="utf-8")

          p = Path("app/src/main/java/com/shamna/ai/MainActivity.java")
          src = p.read_text(encoding="utf-8")

          # Find the first real setContentView call without regex escaping hazards.
          sc = src.find("setContentView(")
          if sc < 0:
              raise SystemExit("setContentView call not found")
          semi = src.find(";", sc)
          if semi < 0:
              raise SystemExit("setContentView terminator not found")
          insert_after = semi + 1

          if "SHAMNA_RUNTIME_MEDIA_LOCATION_PERMISSION_V2" not in src:
              runtime = r'''
                  // SHAMNA_RUNTIME_MEDIA_LOCATION_PERMISSION_V2
                  if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.M) {
                      java.util.ArrayList<String> missing = new java.util.ArrayList<>();
                      if (checkSelfPermission(android.Manifest.permission.RECORD_AUDIO)
                              != android.content.pm.PackageManager.PERMISSION_GRANTED) {
                          missing.add(android.Manifest.permission.RECORD_AUDIO);
                      }
                      if (checkSelfPermission(android.Manifest.permission.CAMERA)
                              != android.content.pm.PackageManager.PERMISSION_GRANTED) {
                          missing.add(android.Manifest.permission.CAMERA);
                      }
                      if (checkSelfPermission(android.Manifest.permission.ACCESS_FINE_LOCATION)
                              != android.content.pm.PackageManager.PERMISSION_GRANTED
                              && checkSelfPermission(android.Manifest.permission.ACCESS_COARSE_LOCATION)
                              != android.content.pm.PackageManager.PERMISSION_GRANTED) {
                          missing.add(android.Manifest.permission.ACCESS_FINE_LOCATION);
                          missing.add(android.Manifest.permission.ACCESS_COARSE_LOCATION);
                      }
                      if (!missing.isEmpty()) {
                          requestPermissions(missing.toArray(new String[0]), 7001);
                      }
                  }
              '''
              src = src[:insert_after] + "\n" + runtime + src[insert_after:]

          # Enable geolocation in WebView settings.
          settings_marker = "WebSettings settings = webView.getSettings();"
          if settings_marker in src and "SHAMNA_WEBVIEW_GEOLOCATION_V1" not in src:
              geo_settings = r'''
                  // SHAMNA_WEBVIEW_GEOLOCATION_V1
                  settings.setGeolocationEnabled(true);
              '''
              src = src.replace(settings_marker, settings_marker + "\n" + geo_settings, 1)

          # Replace the existing WebChromeClient onPermissionRequest implementation
          # instead of adding a second override.
          sig = "public void onPermissionRequest"
          sp = src.find(sig)
          if sp < 0:
              raise SystemExit("Existing onPermissionRequest method not found")
          open_brace = src.find("{", sp)
          if open_brace < 0:
              raise SystemExit("onPermissionRequest opening brace not found")
          depth = 0
          close_brace = -1
          i = open_brace
          while i < len(src):
              ch = src[i]
              if ch == "{":
                  depth += 1
              elif ch == "}":
                  depth -= 1
                  if depth == 0:
                      close_brace = i
                      break
              i += 1
          if close_brace < 0:
              raise SystemExit("onPermissionRequest closing brace not found")

          method = r'''public void onPermissionRequest(final android.webkit.PermissionRequest request) {
                          // SHAMNA_WEBVIEW_MEDIA_PERMISSION_V4
                          if (request == null) return;
                          runOnUiThread(() -> {
                              try {
                                  java.util.ArrayList<String> allowed = new java.util.ArrayList<>();
                                  for (String resource : request.getResources()) {
                                      if (android.webkit.PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(resource)) {
                                          if (android.os.Build.VERSION.SDK_INT < android.os.Build.VERSION_CODES.M
                                                  || checkSelfPermission(android.Manifest.permission.RECORD_AUDIO)
                                                  == android.content.pm.PackageManager.PERMISSION_GRANTED) {
                                              allowed.add(resource);
                                          }
                                      } else if (android.webkit.PermissionRequest.RESOURCE_VIDEO_CAPTURE.equals(resource)) {
                                          if (android.os.Build.VERSION.SDK_INT < android.os.Build.VERSION_CODES.M
                                                  || checkSelfPermission(android.Manifest.permission.CAMERA)
                                                  == android.content.pm.PackageManager.PERMISSION_GRANTED) {
                                              allowed.add(resource);
                                          }
                                      }
                                  }
                                  if (!allowed.isEmpty()) {
                                      request.grant(allowed.toArray(new String[0]));
                                  } else {
                                      request.deny();
                                  }
                              } catch (Exception e) {
                                  try { request.deny(); } catch (Exception ignored) {}
                              }
                          });
                      }'''
          src = src[:sp] + method + src[close_brace+1:]

          # Add geolocation handling to the same WebChromeClient.
          if "SHAMNA_GEOLOCATION_PROMPT_V1" not in src:
              chrome_marker = "webView.setWebChromeClient(new WebChromeClient() {"
              cp = src.find(chrome_marker)
              if cp < 0:
                  raise SystemExit("WebChromeClient block not found for geolocation")
              brace = src.find("{", cp)
              if brace < 0:
                  raise SystemExit("WebChromeClient opening brace not found")
              geo_method = r'''
                  // SHAMNA_GEOLOCATION_PROMPT_V1
                  @Override
                  public void onGeolocationPermissionsShowPrompt(
                          String origin,
                          android.webkit.GeolocationPermissions.Callback callback) {
                      boolean granted = android.os.Build.VERSION.SDK_INT < android.os.Build.VERSION_CODES.M
                          || checkSelfPermission(android.Manifest.permission.ACCESS_FINE_LOCATION)
                              == android.content.pm.PackageManager.PERMISSION_GRANTED
                          || checkSelfPermission(android.Manifest.permission.ACCESS_COARSE_LOCATION)
                              == android.content.pm.PackageManager.PERMISSION_GRANTED;
                      callback.invoke(origin, granted, false);
                  }
              '''
              src = src[:brace+1] + "\n" + geo_method + src[brace+1:]

          p.write_text(src, encoding="utf-8")
          print("Location, camera and microphone permissions patched")
          PY

      - name: Add draggable translucent refresh button
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/java/com/shamna/ai/MainActivity.java")
          src = p.read_text(encoding="utf-8")

          if "SHAMNA_DRAGGABLE_REFRESH_V1" not in src:
              needle = "webView = findViewById(R.id.webView);"
              if needle not in src:
                  raise SystemExit("WebView initialization not found")

              code = r'''
                  // SHAMNA_DRAGGABLE_REFRESH_V1
                  try {
                      android.view.View content = findViewById(android.R.id.content);
                      if (content instanceof android.widget.FrameLayout) {
                          final android.widget.FrameLayout refreshFrame =
                              (android.widget.FrameLayout) content;

                          final android.widget.TextView refreshButton =
                              new android.widget.TextView(this);
                          refreshButton.setText("↻");
                          refreshButton.setTextSize(24f);
                          refreshButton.setTextColor(android.graphics.Color.argb(235, 255, 255, 255));
                          refreshButton.setGravity(android.view.Gravity.CENTER);
                          refreshButton.setClickable(true);
                          refreshButton.setFocusable(true);
                          refreshButton.setAlpha(0.82f);
                          refreshButton.setElevation(9990f);

                          final float density = getResources().getDisplayMetrics().density;
                          final int buttonSize = Math.round(46f * density);

                          android.graphics.drawable.GradientDrawable bg =
                              new android.graphics.drawable.GradientDrawable();
                          bg.setShape(android.graphics.drawable.GradientDrawable.OVAL);
                          bg.setColor(android.graphics.Color.argb(150, 18, 92, 74));
                          bg.setStroke(
                              Math.max(1, Math.round(1.2f * density)),
                              android.graphics.Color.argb(185, 255, 255, 255)
                          );
                          refreshButton.setBackground(bg);

                          android.widget.FrameLayout.LayoutParams lp =
                              new android.widget.FrameLayout.LayoutParams(buttonSize, buttonSize);
                          lp.gravity = android.view.Gravity.RIGHT | android.view.Gravity.CENTER_VERTICAL;
                          lp.rightMargin = Math.round(8f * density);
                          refreshFrame.addView(refreshButton, lp);

                          final float[] downRaw = new float[2];
                          final float[] downXY = new float[2];
                          final boolean[] dragged = new boolean[1];

                          refreshButton.setOnTouchListener((v, event) -> {
                              switch (event.getActionMasked()) {
                                  case android.view.MotionEvent.ACTION_DOWN:
                                      downRaw[0] = event.getRawX();
                                      downRaw[1] = event.getRawY();
                                      downXY[0] = v.getX();
                                      downXY[1] = v.getY();
                                      dragged[0] = false;
                                      return true;

                                  case android.view.MotionEvent.ACTION_MOVE:
                                      float dx = event.getRawX() - downRaw[0];
                                      float dy = event.getRawY() - downRaw[1];
                                      if (Math.hypot(dx, dy) > 6f * density) dragged[0] = true;

                                      float nx = downXY[0] + dx;
                                      float ny = downXY[1] + dy;
                                      float maxX = Math.max(0f, refreshFrame.getWidth() - v.getWidth());
                                      float maxY = Math.max(0f, refreshFrame.getHeight() - v.getHeight());

                                      v.setX(Math.max(0f, Math.min(nx, maxX)));
                                      v.setY(Math.max(0f, Math.min(ny, maxY)));
                                      return true;

                                  case android.view.MotionEvent.ACTION_UP:
                                      if (!dragged[0]) {
                                          try {
                                              webView.reload();
                                          } catch (Exception ignored) {}
                                      }
                                      return true;

                                  case android.view.MotionEvent.ACTION_CANCEL:
                                      return true;
                              }
                              return false;
                          });
                      }
                  } catch (Exception ignored) {}
              '''
              src = src.replace(needle, needle + "\n" + code, 1)

          p.write_text(src, encoding="utf-8")
          print("Draggable translucent refresh button added")
          PY

      - name: Add premium gold corner covers
