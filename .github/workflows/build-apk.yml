name: Build Shamna AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            echo "sdkmanager not found at expected path:"
            echo "$SDKMANAGER"
            echo "ANDROID_HOME=$ANDROID_HOME"
            find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -20
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Shamna AI project
        shell: bash
        run: |
          unzip -o Shamna_AI_Android_Project.zip
          echo "Project extracted"
          ls -la
          ls -la app

      - name: Fix Android permission code
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/java/com/shamna/ai/MainActivity.java")

          if not p.exists():
              raise SystemExit(f"MainActivity.java not found: {p}")

          s = p.read_text(encoding="utf-8")

          s = s.replace(
              "checkSelfPermission(MainActivity.this, Manifest.permission.CAMERA)",
              "checkSelfPermission(Manifest.permission.CAMERA)"
          )

          s = s.replace(
              "checkSelfPermission(MainActivity.this, Manifest.permission.RECORD_AUDIO)",
              "checkSelfPermission(Manifest.permission.RECORD_AUDIO)"
          )

          p.write_text(s, encoding="utf-8")

          print("MainActivity.java updated successfully")
          PY


      - name: Fix Android safe areas
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/src/main/java/com/shamna/ai/MainActivity.java")
          s = p.read_text(encoding="utf-8")

          marker = "SHAMNA_SAFE_AREA_FIX"
          if marker not in s:
              code = r'''
                  // SHAMNA_SAFE_AREA_FIX
                  final android.view.View shamnaRoot = findViewById(android.R.id.content);
                  if (shamnaRoot != null && android.os.Build.VERSION.SDK_INT >= 20) {
                      shamnaRoot.setOnApplyWindowInsetsListener((view, insets) -> {
                          int topInset = insets.getSystemWindowInsetTop();
                          view.setPadding(
                              view.getPaddingLeft(),
                              topInset,
                              view.getPaddingRight(),
                              0
                          );
                          return insets;
                      });
                      shamnaRoot.requestApplyInsets();
                  }

                  getWindow().setStatusBarColor(android.graphics.Color.rgb(4, 47, 31));
                  getWindow().setNavigationBarColor(android.graphics.Color.rgb(4, 47, 31));
              '''

              m = re.search(r'(^\s*setContentView\s*\([^;]+\);\s*$)', s, flags=re.M)
              if not m:
                  raise SystemExit("Could not find setContentView(...) in MainActivity.java")

              s = s[:m.end()] + "\n" + code + s[m.end():]

          p.write_text(s, encoding="utf-8")
          print("Safe-area fix applied successfully")
          PY

      - name: Fix keyboard chat UX
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          p = Path("app/src/main/java/com/shamna/ai/MainActivity.java")
          s = p.read_text(encoding="utf-8")

          # Ensure the activity always resizes for the soft keyboard.
          if "SHAMNA_KEYBOARD_RESIZE" not in s:
              m = re.search(r'(^\s*setContentView\s*\([^;]+\);\s*$)', s, flags=re.M)
              if not m:
                  raise SystemExit("Could not find setContentView(...)")
              native = """
                  // SHAMNA_KEYBOARD_RESIZE
                  getWindow().setSoftInputMode(
                      android.view.WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE
                      | android.view.WindowManager.LayoutParams.SOFT_INPUT_STATE_ALWAYS_HIDDEN
                  );
              """
              s = s[:m.end()] + "\n" + native + s[m.end():]

          # Inject a compact mobile layout fix after each page finishes loading.
          if "SHAMNA_KEYBOARD_WEB_FIX" not in s:
              js = r"""
          (function(){
            const TOP = window;

            function install(w){
              try{
                if(!w || w.__shamnaNativeV5) return;
                w.__shamnaNativeV5 = true;
                const d = w.document;
                const bridge = w.ShamnaNative || TOP.ShamnaNative;
                if(!d || !bridge) return;

                // SHAMNA_REMOVE_PERCHANCE_AD_BANNER_V1
                function removeAdBanner(){
                  try{
                    const phrases=[
                      'انقر على الإعلان مرة أخرى لفتحه',
                      'انقر على الاعلان مرة أخرى لفتحه',
                      'click the ad again to open it'
                    ];
                    const nodes=Array.from(d.querySelectorAll('body *'));
                    for(const el of nodes){
                      const txt=(el.textContent||'').replace(/\s+/g,' ').trim().toLowerCase();
                      if(!txt || !phrases.some(p=>txt.includes(p.toLowerCase()))) continue;

                      let target=el;
                      for(let i=0;i<5 && target.parentElement;i++){
                        const parent=target.parentElement;
                        const pr=parent.getBoundingClientRect ? parent.getBoundingClientRect() : null;
                        if(pr && pr.height > 0 && pr.height <= 180 && pr.width >= 180){
                          target=parent;
                        }else{
                          break;
                        }
                      }
                      target.style.setProperty('display','none','important');
                      target.style.setProperty('height','0','important');
                      target.style.setProperty('min-height','0','important');
                      target.style.setProperty('max-height','0','important');
                      target.style.setProperty('margin','0','important');
                      target.style.setProperty('padding','0','important');
                      target.style.setProperty('border','0','important');
                      target.style.setProperty('overflow','hidden','important');
                      if(target.setAttribute) target.setAttribute('aria-hidden','true');
                    }
                  }catch(_){}
                }

                removeAdBanner();
                try{
                  new w.MutationObserver(()=>removeAdBanner()).observe(
                    d.documentElement||d,
                    {childList:true,subtree:true,characterData:true}
                  );
                }catch(_){}

                const blobMap = new Map();

                try{
                  const c = w.URL.createObjectURL.bind(w.URL);
                  w.URL.createObjectURL = function(obj){
                    const u = c(obj);
                    try{ blobMap.set(u,obj); }catch(_){}
                    return u;
                  };
                }catch(_){}

                function isExternal(u){
                  try{
                    const x = new w.URL(u, w.location.href);
                    return (x.protocol==='http:' || x.protocol==='https:') &&
                      x.hostname!=='perchance.org' &&
                      !x.hostname.endsWith('.perchance.org');
                  }catch(_){ return false; }
                }

                async function asData(u){
                  if(u.startsWith('data:')){
                    return {data:u,mime:(u.match(/^data:([^;,]+)/)||[])[1]||''};
                  }
                  let bl = blobMap.get(u);
                  if(!bl){
                    const r = await w.fetch(u);
                    bl = await r.blob();
                  }
                  const data = await new Promise((ok,no)=>{
                    const fr = new w.FileReader();
                    fr.onload=()=>ok(fr.result);
                    fr.onerror=no;
                    fr.readAsDataURL(bl);
                  });
                  return {data,mime:bl.type||''};
                }

                function fileName(mime, preferred){
                  if(preferred) return preferred;
                  let ext='';
                  if(mime==='application/pdf') ext='.pdf';
                  else if(mime==='image/png') ext='.png';
                  else if(mime==='image/jpeg') ext='.jpg';
                  else if(mime==='image/webp') ext='.webp';
                  return 'Shamna-AI-'+Date.now()+ext;
                }

                async function nativeSave(url, preferred, mime, openAfter){
                  try{
                    const x = await asData(url);
                    bridge.saveDataUrl(x.data,fileName(mime||x.mime,preferred),mime||x.mime,!!openAfter);
                    return true;
                  }catch(e){
                    try{ console.error('Shamna nativeSave',e); }catch(_){}
                    return false;
                  }
                }

                function findFileUrl(root){
                  let el=root;
                  for(let i=0;i<10 && el;i++,el=el.parentElement){
                    const nodes=[el].concat(Array.from(el.querySelectorAll ? el.querySelectorAll('a,img,object,embed,source') : []));
                    for(const n of nodes){
                      const vals=[
                        n.href,n.src,n.data,
                        n.getAttribute&&n.getAttribute('href'),
                        n.getAttribute&&n.getAttribute('src'),
                        n.getAttribute&&n.getAttribute('data'),
                        n.getAttribute&&n.getAttribute('data-url'),
                        n.getAttribute&&n.getAttribute('data-download'),
                        n.getAttribute&&n.getAttribute('data-src')
                      ].filter(Boolean);
                      for(const v of vals){
                        if(typeof v==='string' && (v.startsWith('blob:')||v.startsWith('data:'))) return v;
                      }
                    }
                  }
                  if(blobMap.size) return Array.from(blobMap.keys()).pop();
                  return '';
                }

                d.addEventListener('click',function(e){
                  try{
                    const a=e.target && e.target.closest ? e.target.closest('a') : null;
                    if(a){
                      const href=a.href||a.getAttribute('href')||'';
                      if(isExternal(href)){
                        e.preventDefault();
                        e.stopImmediatePropagation();
                        bridge.openBrowser(href);
                        return;
                      }
                      if(href.startsWith('blob:')||href.startsWith('data:')){
                        e.preventDefault();
                        e.stopImmediatePropagation();
                        const txt=(a.textContent||'').trim();
                        nativeSave(href,a.getAttribute('download')||'','',/فتح|open/i.test(txt));
                        return;
                      }
                    }

                    const btn=e.target && e.target.closest ? e.target.closest('button,[role="button"],a') : null;
                    if(!btn) return;
                    const txt=(btn.textContent||'').replace(/\s+/g,' ').trim();
                    if(/تحميل|تنزيل|download|حفظ/i.test(txt) || /فتح|open/i.test(txt)){
                      const u=findFileUrl(btn);
                      if(u){
                        e.preventDefault();
                        e.stopImmediatePropagation();
                        const openAfter=/فتح|open/i.test(txt) && !/تحميل|تنزيل|download|حفظ/i.test(txt);
                        const mime=/pdf/i.test(txt)?'application/pdf':(/صورة|image/i.test(txt)?'image/png':'');
                        nativeSave(u,'',mime,openAfter);
                      }
                    }
                  }catch(err){
                    try{ console.error('Shamna click intercept',err); }catch(_){}
                  }
                },true);

                const oldOpen=w.open;
                w.open=function(url,target,features){
                  try{
                    if(typeof url==='string'){
                      if(isExternal(url)){
                        bridge.openBrowser(url);
                        return null;
                      }
                      if(url.startsWith('blob:')||url.startsWith('data:')){
                        nativeSave(url,'','',true);
                        return null;
                      }
                    }
                  }catch(_){}
                  return oldOpen ? oldOpen.call(w,url,target,features) : null;
                };

                try{
                  const oldClick=w.HTMLAnchorElement.prototype.click;
                  w.HTMLAnchorElement.prototype.click=function(){
                    try{
                      const href=this.href||this.getAttribute('href')||'';
                      if(isExternal(href)){
                        bridge.openBrowser(href);
                        return;
                      }
                      if(href.startsWith('blob:')||href.startsWith('data:')){
                        nativeSave(href,this.getAttribute('download')||'','',false);
                        return;
                      }
                    }catch(_){}
                    return oldClick.call(this);
                  };
                }catch(_){}

                function scanFrames(){
                  try{
                    d.querySelectorAll('iframe').forEach(fr=>{
                      try{
                        const cw=fr.contentWindow;
                        if(cw) install(cw);
                        fr.addEventListener('load',()=>{ try{ install(fr.contentWindow); }catch(_){} },{once:false});
                      }catch(_){}
                    });
                  }catch(_){}
                }

                scanFrames();
                try{
                  new w.MutationObserver(scanFrames).observe(d.documentElement||d,{childList:true,subtree:true});
                }catch(_){}
              }catch(_){}
            }

            install(TOP);
          })();
          """
              java_literal = json.dumps(js, ensure_ascii=False)

              old = "                progressBar.setVisibility(View.GONE);"
              if old not in s:
                  raise SystemExit("Could not find onPageFinished progress line")
              replacement = old + """
                  // SHAMNA_KEYBOARD_WEB_FIX
                  view.postDelayed(() -> view.evaluateJavascript(""" + java_literal + """, null), 250);"""
              s = s.replace(old, replacement, 1)

          p.write_text(s, encoding="utf-8")
          print("Keyboard/chat UX fix applied successfully")
          PY

      - name: Fix WebView downloads
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json

          p = Path("app/src/main/java/com/shamna/ai/MainActivity.java")
          s = p.read_text(encoding="utf-8")

          # Always load the real Shamna generator directly.
          s = s.replace("https://shamna-ai.vercel.app", "https://perchance.org/shamna-ai")

          m = re.search(r'\bWebView\s+(\w+)\s*;', s) or re.search(r'\bWebView\s+(\w+)\s*=', s)
          if not m:
              raise SystemExit("Could not detect WebView variable")
          wv = m.group(1)

          anchor = re.search(r'^\s*'+re.escape(wv)+r'\.loadUrl\([^;]+\);\s*$', s, flags=re.M)
          if not anchor:
              raise SystemExit("Could not find loadUrl")

          native = r'''
                  // SHAMNA_DOWNLOAD_BRIDGE_V5
                  __WEBVIEW__.addJavascriptInterface(new Object() {
                      private final java.util.concurrent.ConcurrentHashMap<String, java.io.File> tempFiles =
                          new java.util.concurrent.ConcurrentHashMap<>();
                      private final java.util.concurrent.ConcurrentHashMap<String, String> tempNames =
                          new java.util.concurrent.ConcurrentHashMap<>();
                      private final java.util.concurrent.ConcurrentHashMap<String, String> tempMimes =
                          new java.util.concurrent.ConcurrentHashMap<>();
                      private final java.util.concurrent.ConcurrentHashMap<String, Boolean> tempOpen =
                          new java.util.concurrent.ConcurrentHashMap<>();

                      private String sanitizeName(String suggestedName, String mime) {
                          String safeMime = (mime == null || mime.trim().isEmpty())
                              ? "application/octet-stream" : mime.trim();
                          String ext = android.webkit.MimeTypeMap.getSingleton()
                              .getExtensionFromMimeType(safeMime);
                          String name = (suggestedName == null || suggestedName.trim().isEmpty())
                              ? ("Shamna-AI-" + System.currentTimeMillis())
                              : suggestedName.trim();
                          name = name.replaceAll("[\\\\/:*?\"<>|]", "_");
                          if (ext != null && !ext.isEmpty()
                                  && !name.toLowerCase(java.util.Locale.ROOT)
                                      .endsWith("." + ext.toLowerCase(java.util.Locale.ROOT))) {
                              name += "." + ext;
                          }
                          return name;
                      }

                      private android.net.Uri saveFile(java.io.File source, String suggestedName, String mime)
                              throws Exception {
                          String safeMime = (mime == null || mime.trim().isEmpty())
                              ? "application/octet-stream" : mime.trim();
                          String name = sanitizeName(suggestedName, safeMime);

                          if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.Q) {
                              android.content.ContentResolver resolver = getContentResolver();
                              android.content.ContentValues values = new android.content.ContentValues();
                              values.put(android.provider.MediaStore.MediaColumns.DISPLAY_NAME, name);
                              values.put(android.provider.MediaStore.MediaColumns.MIME_TYPE, safeMime);
                              values.put(
                                  android.provider.MediaStore.MediaColumns.RELATIVE_PATH,
                                  android.os.Environment.DIRECTORY_DOWNLOADS + "/Shamna AI"
                              );
                              values.put(android.provider.MediaStore.MediaColumns.IS_PENDING, 1);

                              android.net.Uri uri = resolver.insert(
                                  android.provider.MediaStore.Downloads.EXTERNAL_CONTENT_URI,
                                  values
                              );
                              if (uri == null) throw new java.io.IOException("MediaStore insert failed");

                              try (java.io.InputStream in = new java.io.FileInputStream(source);
                                   java.io.OutputStream out = resolver.openOutputStream(uri)) {
                                  if (out == null) throw new java.io.IOException("Output stream failed");
                                  byte[] buffer = new byte[131072];
                                  int n;
                                  while ((n = in.read(buffer)) != -1) out.write(buffer, 0, n);
                                  out.flush();
                              }

                              values.clear();
                              values.put(android.provider.MediaStore.MediaColumns.IS_PENDING, 0);
                              resolver.update(uri, values, null, null);
                              return uri;
                          }

                          java.io.File dir = new java.io.File(
                              android.os.Environment.getExternalStoragePublicDirectory(
                                  android.os.Environment.DIRECTORY_DOWNLOADS
                              ),
                              "Shamna AI"
                          );
                          if (!dir.exists() && !dir.mkdirs()) {
                              throw new java.io.IOException("Cannot create downloads directory");
                          }
                          java.io.File dest = new java.io.File(dir, name);
                          try (java.io.InputStream in = new java.io.FileInputStream(source);
                               java.io.OutputStream out = new java.io.FileOutputStream(dest)) {
                              byte[] buffer = new byte[131072];
                              int n;
                              while ((n = in.read(buffer)) != -1) out.write(buffer, 0, n);
                              out.flush();
                          }
                          return androidx.core.content.FileProvider.getUriForFile(
                              MainActivity.this,
                              getPackageName() + ".fileprovider",
                              dest
                          );
                      }

                      private void openUri(android.net.Uri uri, String mime) {
                          try {
                              android.content.Intent v = new android.content.Intent(
                                  android.content.Intent.ACTION_VIEW
                              );
                              v.setDataAndType(
                                  uri,
                                  (mime == null || mime.isEmpty()) ? "*/*" : mime
                              );
                              v.addFlags(android.content.Intent.FLAG_GRANT_READ_URI_PERMISSION);
                              startActivity(android.content.Intent.createChooser(v, "فتح الملف باستخدام"));
                          } catch (Exception ignored) {}
                      }

                      @android.webkit.JavascriptInterface
                      public String beginChunkedDownload(
                              String name, String mime, boolean openAfter) {
                          try {
                              String id = java.util.UUID.randomUUID().toString();
                              java.io.File tmp = java.io.File.createTempFile(
                                  "shamna-", ".part", getCacheDir()
                              );
                              tempFiles.put(id, tmp);
                              tempNames.put(id, name == null ? "" : name);
                              tempMimes.put(id, mime == null ? "" : mime);
                              tempOpen.put(id, openAfter);
                              return id;
                          } catch (Exception e) {
                              return "";
                          }
                      }

                      @android.webkit.JavascriptInterface
                      public boolean appendDownloadChunk(String id, String base64Chunk) {
                          java.io.File file = tempFiles.get(id);
                          if (file == null || base64Chunk == null) return false;
                          try {
                              byte[] bytes = android.util.Base64.decode(
                                  base64Chunk,
                                  android.util.Base64.DEFAULT
                              );
                              try (java.io.FileOutputStream out =
                                      new java.io.FileOutputStream(file, true)) {
                                  out.write(bytes);
                                  out.flush();
                              }
                              return true;
                          } catch (Exception e) {
                              return false;
                          }
                      }

                      @android.webkit.JavascriptInterface
                      public void finishChunkedDownload(String id) {
                          java.io.File file = tempFiles.remove(id);
                          String name = tempNames.remove(id);
                          String mime = tempMimes.remove(id);
                          Boolean openAfter = tempOpen.remove(id);
                          if (file == null) return;

                          new Thread(() -> {
                              try {
                                  android.net.Uri uri = saveFile(file, name, mime);
                                  runOnUiThread(() -> {
                                      android.widget.Toast.makeText(
                                          MainActivity.this,
                                          "تم حفظ الملف في التنزيلات",
                                          android.widget.Toast.LENGTH_SHORT
                                      ).show();
                                      if (Boolean.TRUE.equals(openAfter)) openUri(uri, mime);
                                  });
                              } catch (Exception e) {
                                  runOnUiThread(() -> android.widget.Toast.makeText(
                                      MainActivity.this,
                                      "تعذر تنزيل الملف",
                                      android.widget.Toast.LENGTH_LONG
                                  ).show());
                              } finally {
                                  try { file.delete(); } catch (Exception ignored) {}
                              }
                          }).start();
                      }

                      @android.webkit.JavascriptInterface
                      public void cancelChunkedDownload(String id) {
                          java.io.File file = tempFiles.remove(id);
                          tempNames.remove(id);
                          tempMimes.remove(id);
                          tempOpen.remove(id);
                          if (file != null) try { file.delete(); } catch (Exception ignored) {}
                      }

                      @android.webkit.JavascriptInterface
                      public void downloadHttp(String url, String suggestedName, String mime) {
                          if (url == null || !(url.startsWith("http://") || url.startsWith("https://"))) {
                              return;
                          }
                          runOnUiThread(() -> {
                              try {
                                  android.app.DownloadManager.Request req =
                                      new android.app.DownloadManager.Request(android.net.Uri.parse(url));
                                  String ua = __WEBVIEW__.getSettings().getUserAgentString();
                                  if (ua != null && !ua.isEmpty()) {
                                      req.addRequestHeader("User-Agent", ua);
                                  }
                                  String cookie = android.webkit.CookieManager.getInstance()
                                      .getCookie(url);
                                  if (cookie != null && !cookie.isEmpty()) {
                                      req.addRequestHeader("Cookie", cookie);
                                  }
                                  String referer = __WEBVIEW__.getUrl();
                                  if (referer != null && !referer.isEmpty()) {
                                      req.addRequestHeader("Referer", referer);
                                  }

                                  String realMime = (mime == null) ? "" : mime;
                                  if (!realMime.isEmpty()) req.setMimeType(realMime);
                                  String name = sanitizeName(
                                      suggestedName == null || suggestedName.isEmpty()
                                          ? android.webkit.URLUtil.guessFileName(url, null, realMime)
                                          : suggestedName,
                                      realMime
                                  );

                                  req.setTitle(name);
                                  req.setAllowedOverMetered(true);
                                  req.setAllowedOverRoaming(true);
                                  req.setNotificationVisibility(
                                      android.app.DownloadManager.Request
                                          .VISIBILITY_VISIBLE_NOTIFY_COMPLETED
                                  );
                                  req.setDestinationInExternalPublicDir(
                                      android.os.Environment.DIRECTORY_DOWNLOADS,
                                      "Shamna AI/" + name
                                  );
                                  ((android.app.DownloadManager)getSystemService(DOWNLOAD_SERVICE))
                                      .enqueue(req);
                                  android.widget.Toast.makeText(
                                      MainActivity.this,
                                      "بدأ التنزيل",
                                      android.widget.Toast.LENGTH_SHORT
                                  ).show();
                              } catch (Exception e) {
                                  android.widget.Toast.makeText(
                                      MainActivity.this,
                                      "تعذر بدء التنزيل",
                                      android.widget.Toast.LENGTH_LONG
                                  ).show();
                              }
                          });
                      }

                      @android.webkit.JavascriptInterface
                      public void openBrowser(String url) {
                          if (url == null || url.isEmpty()) return;
                          runOnUiThread(() -> {
                              try {
                                  android.content.Intent i = new android.content.Intent(
                                      android.content.Intent.ACTION_VIEW,
                                      android.net.Uri.parse(url)
                                  );
                                  i.addCategory(android.content.Intent.CATEGORY_BROWSABLE);
                                  startActivity(i);
                              } catch (Exception e) {
                                  android.widget.Toast.makeText(
                                      MainActivity.this,
                                      "تعذر فتح المتصفح",
                                      android.widget.Toast.LENGTH_LONG
                                  ).show();
                              }
                          });
                      }
                  }, "ShamnaNative");

                  __WEBVIEW__.setDownloadListener((url, userAgent, contentDisposition, mimeType, contentLength) -> {
                      if (url == null || url.isEmpty()) return;
                      try {
                          if (url.startsWith("http://") || url.startsWith("https://")) {
                              String filename = android.webkit.URLUtil.guessFileName(
                                  url, contentDisposition, mimeType
                              );
                              String qu = org.json.JSONObject.quote(url);
                              String qn = org.json.JSONObject.quote(filename);
                              String qm = org.json.JSONObject.quote(
                                  mimeType == null ? "" : mimeType
                              );
                              __WEBVIEW__.evaluateJavascript(
                                  "ShamnaNative.downloadHttp(" + qu + "," + qn + "," + qm + ");",
                                  null
                              );
                              return;
                          }

                          String qu = org.json.JSONObject.quote(url);
                          String qn = org.json.JSONObject.quote(
                              android.webkit.URLUtil.guessFileName(
                                  url, contentDisposition, mimeType
                              )
                          );
                          String qm = org.json.JSONObject.quote(
                              mimeType == null ? "" : mimeType
                          );
                          String js = "(async()=>{try{"
                              + "const u=" + qu + ";"
                              + "let b=await fetch(u).then(r=>r.blob());"
                              + "const id=ShamnaNative.beginChunkedDownload("
                              + qn + "," + qm + "||b.type||'',false);"
                              + "if(!id)throw new Error('begin failed');"
                              + "const CH=196608;"
                              + "for(let o=0;o<b.size;o+=CH){"
                              + "const sl=b.slice(o,Math.min(o+CH,b.size));"
                              + "const ab=await sl.arrayBuffer();"
                              + "let bin='',v=new Uint8Array(ab);"
                              + "for(let i=0;i<v.length;i+=8192){"
                              + "bin+=String.fromCharCode.apply(null,v.subarray(i,Math.min(i+8192,v.length)));}"
                              + "if(!ShamnaNative.appendDownloadChunk(id,btoa(bin)))"
                              + "throw new Error('chunk failed');}"
                              + "ShamnaNative.finishChunkedDownload(id);"
                              + "}catch(e){console.error('Shamna download',e);}})();";
                          __WEBVIEW__.evaluateJavascript(js, null);
                      } catch (Exception e) {
                          android.widget.Toast.makeText(
                              MainActivity.this,
                              "تعذر تنزيل الملف",
                              android.widget.Toast.LENGTH_LONG
                          ).show();
                      }
                  });
          '''
          native = native.replace("__WEBVIEW__", wv)
          s = s[:anchor.start()] + native + "\n" + s[anchor.start():]

          # Do not force download-like new windows out to the browser. Ordinary
          # links are still handled by the page interceptor below.
          if "SHAMNA_CHROME_EXTERNAL_V3" not in s:
              chrome_anchor = re.search(
                  r'\b'+re.escape(wv)+r'\.setWebChromeClient\s*\(new\s+WebChromeClient\s*\(\)\s*\{',
                  s
              )
              if chrome_anchor:
                  pos = chrome_anchor.end()
                  method = r'''
                      // SHAMNA_CHROME_EXTERNAL_V3
                      @Override
                      public boolean onCreateWindow(
                              WebView view, boolean isDialog,
                              boolean isUserGesture, android.os.Message resultMsg) {
                          try {
                              WebView.HitTestResult hit = view.getHitTestResult();
                              String url = hit != null ? hit.getExtra() : null;
                              if (url != null && (url.startsWith("http://")
                                      || url.startsWith("https://"))) {
                                  android.content.Intent i = new android.content.Intent(
                                      android.content.Intent.ACTION_VIEW,
                                      android.net.Uri.parse(url)
                                  );
                                  i.addCategory(android.content.Intent.CATEGORY_BROWSABLE);
                                  startActivity(i);
                              }
                          } catch (Exception ignored) {}
                          return false;
                      }
                  '''
                  s = s[:pos] + "\n" + method + s[pos:]

          js = r"""
          (function(){
            if(window.__shamnaDownloadV5) return;
            window.__shamnaDownloadV5=true;

            const bridge=window.ShamnaNative;
            if(!bridge) return;

            const blobMap=new Map();
            try{
              const oldCreate=URL.createObjectURL.bind(URL);
              URL.createObjectURL=function(obj){
                const u=oldCreate(obj);
                try{blobMap.set(u,obj);}catch(_){}
                return u;
              };
            }catch(_){}

            function isHttp(u){
              return typeof u==='string' && /^https?:/i.test(u);
            }
            function isBinaryUrl(u){
              return typeof u==='string' &&
                (u.startsWith('blob:') || u.startsWith('data:') || isHttp(u));
            }
            function isExternal(u){
              try{
                const x=new URL(u,location.href);
                return (x.protocol==='http:'||x.protocol==='https:') &&
                  x.hostname!=='perchance.org' &&
                  !x.hostname.endsWith('.perchance.org');
              }catch(_){return false;}
            }

            function nameFor(mime,preferred,url){
              if(preferred) return preferred;
              try{
                if(url && isHttp(url)){
                  const p=new URL(url,location.href).pathname.split('/').pop();
                  if(p && p.includes('.')) return decodeURIComponent(p);
                }
              }catch(_){}
              let e='';
              if(mime==='application/pdf')e='.pdf';
              else if(mime==='image/png')e='.png';
              else if(mime==='image/jpeg')e='.jpg';
              else if(mime==='image/webp')e='.webp';
              else if(mime==='video/mp4')e='.mp4';
              else if(mime==='audio/mpeg')e='.mp3';
              return 'Shamna-AI-'+Date.now()+e;
            }

            async function blobFor(url){
              if(url.startsWith('data:')) return await fetch(url).then(r=>r.blob());
              if(url.startsWith('blob:')){
                const cached=blobMap.get(url);
                if(cached) return cached;
                return await fetch(url).then(r=>r.blob());
              }
              return null;
            }

            async function saveBlobLike(url,preferred,mime,openAfter){
              let id='';
              try{
                if(isHttp(url)){
                  bridge.downloadHttp(
                    url,
                    nameFor(mime,preferred,url),
                    mime||''
                  );
                  return true;
                }

                const b=await blobFor(url);
                if(!b) return false;
                const realMime=mime||b.type||'application/octet-stream';
                id=bridge.beginChunkedDownload(
                  nameFor(realMime,preferred,url),
                  realMime,
                  !!openAfter
                );
                if(!id) throw new Error('beginChunkedDownload failed');

                const CHUNK=196608;
                for(let offset=0;offset<b.size;offset+=CHUNK){
                  const part=b.slice(offset,Math.min(offset+CHUNK,b.size));
                  const ab=await part.arrayBuffer();
                  const bytes=new Uint8Array(ab);
                  let binary='';
                  for(let i=0;i<bytes.length;i+=8192){
                    binary+=String.fromCharCode.apply(
                      null,
                      bytes.subarray(i,Math.min(i+8192,bytes.length))
                    );
                  }
                  if(!bridge.appendDownloadChunk(id,btoa(binary))){
                    throw new Error('appendDownloadChunk failed');
                  }
                }
                bridge.finishChunkedDownload(id);
                return true;
              }catch(err){
                try{if(id)bridge.cancelChunkedDownload(id);}catch(_){}
                try{console.error('Shamna save failed',err);}catch(_){}
                return false;
              }
            }

            function candidateUrls(root){
              const out=[];
              let el=root;
              for(let depth=0;depth<10 && el;depth++,el=el.parentElement){
                const nodes=[el].concat(Array.from(
                  el.querySelectorAll
                    ? el.querySelectorAll('a,img,video,audio,source,object,embed')
                    : []
                ));
                for(const n of nodes){
                  const vals=[
                    n.href,n.src,n.currentSrc,n.data,
                    n.getAttribute&&n.getAttribute('href'),
                    n.getAttribute&&n.getAttribute('src'),
                    n.getAttribute&&n.getAttribute('data'),
                    n.getAttribute&&n.getAttribute('data-url'),
                    n.getAttribute&&n.getAttribute('data-download'),
                    n.getAttribute&&n.getAttribute('data-src')
                  ].filter(Boolean);
                  for(const v of vals){
                    try{
                      const abs=(typeof v==='string')
                        ? new URL(v,location.href).href
                        : '';
                      if(isBinaryUrl(abs) && !out.includes(abs)) out.push(abs);
                    }catch(_){
                      if(typeof v==='string' && isBinaryUrl(v) && !out.includes(v)) {
                        out.push(v);
                      }
                    }
                  }
                }
              }
              if(blobMap.size){
                const last=Array.from(blobMap.keys()).pop();
                if(last && !out.includes(last)) out.unshift(last);
              }
              return out;
            }

            function isDownloadIntent(el){
              if(!el) return false;
              const txt=(el.textContent||'').replace(/\s+/g,' ').trim();
              return /تحميل|تنزيل|download|save|حفظ|export|تصدير/i.test(txt)
                || !!(el.getAttribute && el.getAttribute('download'));
            }

            document.addEventListener('click',function(e){
              try{
                const a=e.target&&e.target.closest?e.target.closest('a'):null;
                if(a){
                  const raw=a.getAttribute('href')||a.href||'';
                  let href=raw;
                  try{href=new URL(raw,location.href).href;}catch(_){}

                  if(a.hasAttribute('download') && isBinaryUrl(href)){
                    e.preventDefault();
                    e.stopImmediatePropagation();
                    saveBlobLike(
                      href,
                      a.getAttribute('download')||'',
                      '',
                      false
                    );
                    return;
                  }

                  if((href.startsWith('blob:')||href.startsWith('data:'))){
                    e.preventDefault();
                    e.stopImmediatePropagation();
                    saveBlobLike(href,a.getAttribute('download')||'','',false);
                    return;
                  }

                  if(isExternal(href) && !isDownloadIntent(a)){
                    e.preventDefault();
                    e.stopImmediatePropagation();
                    bridge.openBrowser(href);
                    return;
                  }
                }

                const b=e.target&&e.target.closest
                  ? e.target.closest('button,[role="button"],a')
                  : null;
                if(!b || !isDownloadIntent(b)) return;

                const urls=candidateUrls(b);
                const u=urls.find(x=>x.startsWith('blob:')||x.startsWith('data:'))
                  || urls.find(isHttp);
                if(!u) return;

                e.preventDefault();
                e.stopImmediatePropagation();

                const txt=(b.textContent||'').replace(/\s+/g,' ').trim();
                const mime=/pdf/i.test(txt)
                  ? 'application/pdf'
                  : (/صورة|image/i.test(txt)
                      ? 'image/png'
                      : (/فيديو|video/i.test(txt)
                          ? 'video/mp4'
                          : (/صوت|audio/i.test(txt)?'audio/mpeg':'')));
                saveBlobLike(u,'',mime,false);
              }catch(err){
                try{console.error('Shamna click download',err);}catch(_){}
              }
            },true);

            const oldOpen=window.open;
            window.open=function(url,target,features){
              try{
                if(typeof url==='string'){
                  let abs=url;
                  try{abs=new URL(url,location.href).href;}catch(_){}
                  if(abs.startsWith('blob:')||abs.startsWith('data:')){
                    saveBlobLike(abs,'','',true);
                    return null;
                  }
                }
              }catch(_){}
              return oldOpen ? oldOpen.call(window,url,target,features) : null;
            };

            try{
              const oldClick=HTMLAnchorElement.prototype.click;
              HTMLAnchorElement.prototype.click=function(){
                try{
                  const raw=this.getAttribute('href')||this.href||'';
                  let href=raw;
                  try{href=new URL(raw,location.href).href;}catch(_){}
                  if(this.hasAttribute('download') && isBinaryUrl(href)){
                    saveBlobLike(
                      href,
                      this.getAttribute('download')||'',
                      '',
                      false
                    );
                    return;
                  }
                  if(href.startsWith('blob:')||href.startsWith('data:')){
                    saveBlobLike(href,this.getAttribute('download')||'','',false);
                    return;
                  }
                }catch(_){}
                return oldClick.call(this);
              };
            }catch(_){}

            function installFrames(){
              try{
                document.querySelectorAll('iframe').forEach(fr=>{
                  try{
                    const w=fr.contentWindow;
                    if(!w || w.__shamnaFrameDownloadV5) return;
                    w.__shamnaFrameDownloadV5=true;
                    // Same-origin frames inherit the top native bridge. Their own
                    // native download events still fall through to DownloadListener.
                    try{
                      w.ShamnaNative=bridge;
                    }catch(_){}
                  }catch(_){}
                });
              }catch(_){}
            }
            installFrames();
            try{
              new MutationObserver(installFrames).observe(
                document.documentElement||document,
                {childList:true,subtree:true}
              );
            }catch(_){}
          })();
          """

          jlit=json.dumps(js,ensure_ascii=False)
          marker="                progressBar.setVisibility(View.GONE);"
          if marker not in s:
              raise SystemExit("onPageFinished marker missing")
          s=s.replace(
              marker,
              marker + "\n                  view.postDelayed(() -> view.evaluateJavascript("
              + jlit + ", null), 150);",
              1
          )

          p.write_text(s,encoding="utf-8")
          print("Download system replaced with chunked blob + native HTTP downloader")
          PY

