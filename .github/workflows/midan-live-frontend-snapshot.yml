name: Recover current public Midan site frontend for safe feature integration
on:
  push:
    paths:
      - '.github/workflows/midan-live-frontend-snapshot.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Download public production UI (never download private server files)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p midan-site-snapshot/live
          for f in index.html reader.html open.html app.js app-inner.js app-legacy.js enhancements.js geo-unified.js source-images.js; do
            if [ "$f" = "index.html" ]; then url="https://midan-al-khabar.vercel.app/"; else url="https://midan-al-khabar.vercel.app/$f"; fi
            curl --fail --location --retry 2 --max-time 30 --silent --show-error "$url" -o "midan-site-snapshot/live/$f"
            test "$(wc -c < "midan-site-snapshot/live/$f")" -gt 500
          done
          printf '%s\n' "# Public frontend snapshot from midan-al-khabar.vercel.app" "No backend code or secrets copied." > midan-site-snapshot/live/README.md
      - name: Commit snapshot (only public files)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add midan-site-snapshot/live
          if ! git diff --cached --quiet; then
            git commit -m 'chore(midan): snapshot public production UI to preserve existing features'
            git push
          fi
