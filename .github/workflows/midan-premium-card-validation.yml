name: Validate premium news cards and source identity logos in production UI
on:
  push:
    paths: ['.github/workflows/midan-premium-card-validation.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: true}
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Capture browser test outcome
        shell: bash
        run: |
          set +e
          node midan-site-snapshot/qa/test-premium-card.cjs > /tmp/midan-premium-test.log 2>&1
          rc=$?
          cp /tmp/midan-premium-test.log midan-site-snapshot/qa/premium-test-log.txt
          cat /tmp/midan-premium-test.log
          exit "$rc"
      - if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A midan-site-snapshot/qa/previews midan-site-snapshot/qa/premium-test-log.txt
          if ! git diff --cached --quiet; then
            git commit -m 'test(midan): verified premium card previews with logos'
            git push
          fi
