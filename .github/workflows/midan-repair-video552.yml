name: Restore original video in existing Midan message 552
on:
  push:
    paths:
      - '.github/workflows/midan-repair-video552.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Restore video using existing bot credentials if configured
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          MIDAN_TELEGRAM_BOT_TOKEN: ${{ secrets.MIDAN_TELEGRAM_BOT_TOKEN }}
        shell: bash
        run: |
          export TELEGRAM_BOT_TOKEN="${TELEGRAM_BOT_TOKEN:-${MIDAN_TELEGRAM_BOT_TOKEN:-}}"
          node midan-site-snapshot/diagnostics/repair_video552.cjs
      - name: Save non-secret outcome
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add midan-site-snapshot/diagnostics/video552-repair-result.json
          if ! git diff --cached --quiet; then
            git commit -m 'diag(midan): video552 repair outcome without secrets'
            git pull --rebase
            git push
          fi
