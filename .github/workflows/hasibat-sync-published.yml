name: Detect published Hasibat APK and sync updates

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/hasibat-sync-published.yml

permissions:
  contents: write

concurrency:
  group: hasibat-published-update-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check out dedicated Hasibat release branch
        uses: actions/checkout@v4
        with:
          ref: hasibat-al-lira
          persist-credentials: true
      - name: Verify Dallalna file and detect newer signed version
        env:
          PYTHONUNBUFFERED: "1"
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 scripts/sync_hasibat_from_dallalna.py
          if git diff --quiet -- hasibat-update.json; then
            echo "No newer signed release published on Dallalna."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hasibat-update.json
          git commit -m "Automatically announce validated Hasibat APK hosted by Dallalna"
          git push origin HEAD:hasibat-al-lira
