name: Hasibat immediate APK update announcement

on:
  push:
    branches:
      - hasibat-al-lira
    paths:
      - hasibat-release-pending.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hasibat-update-announcements
  cancel-in-progress: true

jobs:
  publish-immediately:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out latest release metadata
        uses: actions/checkout@v4
        with:
          ref: hasibat-al-lira
      - name: Validate hosted APK and publish update immediately
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin hasibat-al-lira
          git checkout -B hasibat-al-lira origin/hasibat-al-lira
          python3 - <<'PY'
          import hashlib,json,pathlib,urllib.parse,urllib.request
          pending=json.loads(pathlib.Path('hasibat-release-pending.json').read_text('utf-8'))
          current=json.loads(pathlib.Path('hasibat-update.json').read_text('utf-8'))
          code=int(pending['versionCode'])
          if code<=int(current.get('versionCode',0)):
              print('Latest release already announced; no change.')
              raise SystemExit(0)
          url=str(pending['apkUrl'])
          sha=str(pending['apkSha256']).lower()
          parsed=urllib.parse.urlsplit(url)
          assert (parsed.scheme=='https' and
              parsed.hostname=='ftzmeimurgsqzvmcahhs.supabase.co' and
              parsed.path.startswith('/storage/v1/object/public/site-assets/') and
              parsed.path.endswith('.apk') and
              not parsed.query and not parsed.fragment),'Unexpected APK origin'
          assert len(sha)==64 and all(c in '0123456789abcdef' for c in sha),'Invalid APK SHA-256'
          req=urllib.request.Request(url,headers={'User-Agent':'Hasibat-Android-UpdatePublisher/1.0'})
          digest=hashlib.sha256()
          size=0
          with urllib.request.urlopen(req,timeout=40) as r:
              if r.status!=200:raise ValueError('APK download unavailable')
              magic=r.read(4)
              if magic!=b'PK\x03\x04':raise ValueError('Invalid APK')
              digest.update(magic);size+=4
              while True:
                  chunk=r.read(65536)
                  if not chunk:break
                  size+=len(chunk)
                  if size>120_000_000:raise ValueError('APK too large')
                  digest.update(chunk)
          assert size>30000 and digest.hexdigest()==sha,'File missing/corrupt or SHA mismatch'
          out={
              'versionCode':code,'versionName':str(pending['versionName']),
              'required':bool(pending.get('required',False)),
              'requiresUninstall':False,
              'url':'https://dallalna.com/install',
              'apkUrl':url,'apkSha256':sha,'apkSize':size,
              'message':str(pending.get('message','يتوفر إصدار أحدث من حاسبة الليرة السورية.'))
          }
          pathlib.Path('hasibat-update.json').write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('Published immediately:',code,out['versionName'],size)
          PY
          if git diff --quiet -- hasibat-update.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hasibat-update.json
          git commit -m "Publish verified Hasibat APK update without a 30-minute delay"
          git push origin hasibat-al-lira
