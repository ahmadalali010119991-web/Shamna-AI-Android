name: Diagnose direct Telegram source completeness
on:
  push:
    paths: ['.github/workflows/midan-telegram-public-probe.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: true}
      - run: |
          python midan-site-snapshot/diagnostics/probe_telegram.py > midan-site-snapshot/diagnostics/telegram-structure.txt 2>&1 || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add midan-site-snapshot/diagnostics/telegram-structure.txt
          git commit -m 'diag(midan): Telegram public source structure'
          git push
