name: Prepare verified Hasibat Radio Sunna resource
on:
  push:
    branches: [main]
    paths:
      - 'tools/hasibat/patch_radio_sunna_v1825.py'
      - '.github/workflows/hasibat-radio-sunna-asset.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-resource:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Fetch exact official v1.8.24 and verify signing baseline
        run: |
          set -euo pipefail
          curl -fL --retry 2 --max-time 120 \
            'https://github.com/ahmadalali010119991-web/Shamna-AI-Android/releases/download/hasibat-v1.8.24/Hasibat-AlLira-v1.8.24.apk' \
            -o /tmp/Hasibat-AlLira-v1.8.24.apk
          echo 'd25fd6312a01aae5789dd60d9b1e6b873b82e178fcafa324ff0c458b77aefdbe  /tmp/Hasibat-AlLira-v1.8.24.apk' | sha256sum -c -
      - name: Prepare only original signed APK HTML resource
        run: |
          set -euo pipefail
          python3 tools/hasibat/patch_radio_sunna_v1825.py /tmp/Hasibat-AlLira-v1.8.24.apk hasibat-radio-sunna-index.html
          grep -q 'https://radiosunna.radioca.st/stream' hasibat-radio-sunna-index.html
          if grep -q 'ميراث الأنبياء' hasibat-radio-sunna-index.html; then exit 1; fi
          sha256sum hasibat-radio-sunna-index.html
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Hasibat-1.8.25-Radio-Sunna-Asset-Only-NOT-APK
          path: hasibat-radio-sunna-index.html
          retention-days: 30
          if-no-files-found: error
