name: Validate Telegram clickable news source links
on:
  push:
    branches: [midan-daily-53-links-20261111]
    paths:
      - telegram-shared/source-links.js
      - telegram-shared/test/source-links.test.js
      - .github/workflows/midan-source-links-ci.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - name: Verify link and preserve news content
        run: node --test telegram-shared/test/source-links.test.js
