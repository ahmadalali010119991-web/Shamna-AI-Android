name: Build minimal additive Shamna QA in-place update candidate

# Archived one-time builder for 1.2 -> 1.3; do not rebuild it on newer sources.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa-update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android SDK tooling
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Get the exact already-installed QA APK, not an older replacement
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys,urllib.request,hashlib
          from pathlib import Path
          sys.path.insert(0,"scripts")
          from sync_shamna_from_dallalna import find_shamna_apk
          url=find_shamna_apk()
          if not url: raise SystemExit("No published Shamna QA APK on Dallalna")
          req=urllib.request.Request(url,headers={"User-Agent":"Shamna-QA-Update-Builder/1"})
          h=hashlib.sha256()
          with urllib.request.urlopen(req, timeout=90) as response, open('base.apk','wb') as out:
              while True:
                  b=response.read(65536)
                  if not b:break
                  h.update(b);out.write(b)
          actual=h.hexdigest()
          expected="e4f5df841b6293abce75cbed5ecbc88148e80e80bbea545cb2082229b89cb423"
          print("Dallalna QA APK digest:",actual)
          if actual!=expected:
              raise SystemExit("Dallalna QA APK differs from the user's installed upload. Refusing unsafe rebuild.")
          PY

      - name: Install Apktool and decode only the trusted QA baseline
        shell: bash
        run: |
          set -euo pipefail
          curl -fSL --retry 3 --max-time 90 \
            "https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar" -o apktool.jar
          java -jar apktool.jar d -f base.apk -o unpack
          test -f unpack/smali_classes2/com/shamna/ai/MainActivity.smali

      - name: Add native updater without replacing user features
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("unpack/smali_classes2/com/shamna/ai/MainActivity.smali")
          src=p.read_text('utf-8')
          marker='    invoke-virtual {v8, v0}, Lcom/shamna/ai/MainActivity;->setContentView(I)V'
          if src.count(marker)!=1: raise SystemExit("Cannot safely patch the original MainActivity")
          hook='    invoke-static {v8}, Lcom/shamna/ai/ShamnaUpdateManager;->attach(Landroid/app/Activity;)V'
          src=src.replace(marker,marker+'\n\n'+hook,1)
          p.write_text(src,'utf-8')

          manifest=Path('unpack/AndroidManifest.xml')
          xml=manifest.read_text('utf-8')
          # Apktool represents the original QA application using its base
          # Java namespace; the renameManifestPackage in apktool.yml restores
          # the installed com.shamna.qa package on rebuild.
          if 'package="com.shamna.ai"' not in xml:
              raise SystemExit("Unexpected source namespace during QA decoding")
          for permission in ['android.permission.REQUEST_INSTALL_PACKAGES','android.permission.POST_NOTIFICATIONS']:
              if f'android:name="{permission}"' not in xml:
                  xml=xml.replace('<application',f'<uses-permission android:name="{permission}"/>\n    <application',1)
          manifest.write_text(xml,'utf-8')

          yml=Path('unpack/apktool.yml')
          y=yml.read_text('utf-8')
          if 'renameManifestPackage: com.shamna.qa' not in y:
              raise SystemExit("Apktool QA package remapping lost; refusing build")
          y,n=re.subn(r'(?m)^(  versionCode:)\s*\d+\s*$',r'\g<1> 4',y)
          y,m=re.subn(r'(?m)^(  versionName:)\s*[^\n]+$',r'\g<1> 1.3',y)
          if n!=1 or m!=1: raise SystemExit("Unable to update version metadata")
          yml.write_text(y,'utf-8')
          source=Path('android-updater/ShamnaUpdateManager.java').read_text('utf-8')
          source=source.replace('com.shamna.ai".equals(activity.getPackageName())','com.shamna.qa".equals(activity.getPackageName())')
          source=source.replace('main/shamna-update.json','main/shamna-qa-update.json')
          if 'com.shamna.qa".equals(activity.getPackageName())' not in source:
              raise SystemExit("QA package variant was not selected")
          out=Path('java-src/com/shamna/ai/ShamnaUpdateManager.java')
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(source,'utf-8')
          PY
          mkdir -p java-classes new-dex
          javac -source 8 -target 8 \
            -cp "$ANDROID_HOME/platforms/android-35/android.jar" \
            -d java-classes java-src/com/shamna/ai/ShamnaUpdateManager.java
          d8 --min-api 24 --lib "$ANDROID_HOME/platforms/android-35/android.jar" \
            --output new-dex $(find java-classes -name '*.class')
          test -s new-dex/classes.dex

      - name: Recompile injected MainActivity and Android manifest
        shell: bash
        run: |
          set -euo pipefail
          java -jar apktool.jar b unpack -o apktool-rebuilt.apk
          test -s apktool-rebuilt.apk

      - name: Repack unchanged app assets byte-for-byte and verify build identities
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from zipfile import ZipFile,ZIP_DEFLATED
          from pathlib import Path
          import hashlib,struct
          with ZipFile('base.apk') as base,ZipFile('apktool-rebuilt.apk') as rebuilt, ZipFile('shamna-qa-update-unsigned.apk','w') as target:
              replacements={
                  'AndroidManifest.xml':rebuilt.read('AndroidManifest.xml'),
                  'classes2.dex':rebuilt.read('classes2.dex'),
                  'classes4.dex':Path('new-dex/classes.dex').read_bytes()
              }
              for info in base.infolist():
                  name=info.filename
                  if name.startswith('META-INF/'):continue
                  data=replacements.pop(name,None)
                  if data is None:data=base.read(name)
                  target.writestr(info,data)
              for name,data in replacements.items():target.writestr(name,data,compress_type=ZIP_DEFLATED)
          with ZipFile('base.apk') as base,ZipFile('shamna-qa-update-unsigned.apk') as target:
              expected_mutations={'AndroidManifest.xml','classes2.dex','classes4.dex'}
              for name in base.namelist():
                  if name.startswith('META-INF/') or name in expected_mutations:continue
                  if base.read(name)!=target.read(name):raise SystemExit('Regression: changed app asset '+name)
              if not {'classes.dex','classes2.dex','classes3.dex','classes4.dex'}.issubset(set(target.namelist())):
                  raise SystemExit('A dex file was lost')
          print("PASS: all old app files and resources retained byte-for-byte, except manifest and hooked main dex")
          PY
          zipalign -f -p 4 shamna-qa-update-unsigned.apk shamna-qa-update-aligned-unsigned.apk
          test -s shamna-qa-update-aligned-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Shamna-QA-Inplace-Update-Unsigned-1.3
          path: shamna-qa-update-aligned-unsigned.apk
          retention-days: 10
          if-no-files-found: error
