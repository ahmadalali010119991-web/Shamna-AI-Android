name: Midan news card production smoke test
on:
  push:
    paths: ['.github/workflows/midan-news-card-prod-smoke.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Verify live canonical production endpoints and app-only gate
        shell: bash
        run: |
          set -euo pipefail
          base="https://midan-al-khabar.vercel.app"
          curl -fsSL --retry 2 -A 'Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36 MidanAlKhabarApp/1.3.9' "$base/" -o /tmp/midan-app.html
          grep -q 'id="newsList"' /tmp/midan-app.html
          grep -q 'id="modalContent"' /tmp/midan-app.html
          grep -q '/news-card-studio.js' /tmp/midan-app.html
          grep -q '/media-click-fix.js' /tmp/midan-app.html
          grep -q '/field-feed-enhancer.js' /tmp/midan-app.html
          for asset in media-click-fix.js field-feed-enhancer.js source-images.js sports-view.js; do
            curl -fsSL --retry 2 "$base/$asset" -o "/tmp/$asset"
            node --check "/tmp/$asset"
          done
          grep -q 'voice-post' /tmp/field-feed-enhancer.js
          grep -q 'midan-media-viewer' /tmp/media-click-fix.js
          grep -q "document.createElement('button')" /tmp/source-images.js
          grep -q 'اقرأ المصدر الأصلي' /tmp/sports-view.js
          curl -fsSL --retry 2 'https://raw.githubusercontent.com/ahmadalali010119991-web/Shamna-AI-Android/main/midan-site-snapshot/data/field-news-10h.json' -o /tmp/field-news.json
          node -e 'const x=require("/tmp/field-news.json");if(x.schema!==2||!Array.isArray(x.items)||!x.items.some(p=>p.url==="https://t.me/suhebb0/47987"&&p.fullText.includes("محاسبة")))process.exit(1)'
          curl -fsSL --retry 2 "$base/news-card-studio.js" -o /tmp/news-card-studio.js
          node --check /tmp/news-card-studio.js
          grep -q 'MidanNewsCardStudioLoaded' /tmp/news-card-studio.js
          grep -q 'function mcsTextBox' /tmp/news-card-studio.js
          grep -q 'source-logos/bbc.png' /tmp/news-card-studio.js
          cmp midan-site-snapshot/feature/news-card-studio.js /tmp/news-card-studio.js
          for logo in sana aljazeera suhaib bbc; do
            curl -fsSL --retry 2 "$base/source-logos/$logo.png" -o "/tmp/$logo.png"
            test "$(wc -c < "/tmp/$logo.png")" -gt 100
          done
          curl -fsSL --retry 2 "$base/assets/icon-192-v2.png" -o /tmp/midan-icon.png
          test "$(wc -c </tmp/midan-icon.png)" -gt 1000
          mkdir -p midan-site-snapshot/feature
          printf 'PASS: V3 live UI, in-app media viewer, full-text news recovery, source-only links, 4 source logos; %s\n' "$(date -u -Iseconds)" > midan-site-snapshot/feature/production-smoke.txt
      - name: Commit success report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add midan-site-snapshot/feature/production-smoke.txt
          git commit -m 'test(midan): production news-card smoke passed'
          git push
