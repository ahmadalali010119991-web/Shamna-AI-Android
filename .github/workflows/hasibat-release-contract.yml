name: Hasibat release compatibility and download integrity

on:
  push:
    branches: [hasibat-al-lira]
    paths:
      - 'hasibat-update.json'
      - 'scripts/verify_hasibat_native_version_guard.py'
      - 'scripts/verify_hasibat_release_integrity.py'
      - '.github/workflows/hasibat-release-contract.yml'
  pull_request:
    branches: [hasibat-al-lira]
    paths:
      - 'hasibat-update.json'
      - 'scripts/verify_hasibat_native_version_guard.py'
      - 'scripts/verify_hasibat_release_integrity.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hasibat-release-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-signed-apk-and-user-upgrade:
    name: Check APK signature, package, native URL policy and feature regression
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Ensure Android SDK build-tools 35
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ] || [ ! -x "$ANDROID_HOME/build-tools/35.0.0/aapt" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"
          fi
      - name: Validate live APK against original installed users
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_hasibat_release_integrity.py
