name: Recover original Midan 1.3.3 startup source for safe 1.3.4 update
on:
  push:
    branches: [midan-fcm-repair-134]
    paths: [.github/workflows/midan-134-recover-startup.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Install JADX release and fetch exact signed APK
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 -o /tmp/midan133.apk 'https://github.com/ahmadalali010119991-web/Shamna-AI-Android/releases/download/midan-v1.3.3/Midan-AlKhabar-v1.3.3.apk'
          echo '33e616b365e4713ccfc5def80f0d876688186f06126757a689cb634df638c4fb  /tmp/midan133.apk' | sha256sum -c
          curl -fsSL --retry 2 -o /tmp/jadx.zip 'https://github.com/skylot/jadx/releases/download/v1.5.3/jadx-1.5.3.zip'
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          /tmp/jadx/bin/jadx --no-res --threads-count 2 -d /tmp/decoded /tmp/midan133.apk >/tmp/jadx.log 2>&1 || true
          find /tmp/decoded -name 'MainActivity.java' -o -name 'NewsMessagingService.java' | head
          test -s /tmp/decoded/sources/com/midanalkhabar/app/MainActivity.java
          grep -n -E 'onCreate|onResume|onNewIntent|showLoading|pageTrusted|onPageFinished|activateDefaultNewsNotifications' /tmp/decoded/sources/com/midanalkhabar/app/MainActivity.java | head -45
      - name: Export decompiled read-only source for comparison
        uses: actions/upload-artifact@v4
        with:
          name: midan-133-decompiled-java-compare-only
          path: /tmp/decoded/sources/com/midanalkhabar/app/
          retention-days: 2
