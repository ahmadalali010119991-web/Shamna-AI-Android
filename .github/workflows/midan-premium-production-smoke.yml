name: Verify premium Midan production news cards and identity logos
on:
  push:
    paths: ['.github/workflows/midan-premium-production-smoke.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: true}
      - name: Check live production files and selected source icons
        shell: bash
        run: |
          set -euo pipefail
          base="https://midan-al-khabar.vercel.app"
          curl -fsSL --retry 2 "$base/news-card-studio.js" -o /tmp/news-card-studio.js
          node --check /tmp/news-card-studio.js
          grep -q 'sourceIdentity' /tmp/news-card-studio.js
          grep -q 'تيليجرام' /tmp/news-card-studio.js
          grep -q 'source-logos/sana.png' /tmp/news-card-studio.js
          grep -q 'source-logos/aljazeera.png' /tmp/news-card-studio.js
          grep -q 'source-logos/suhaib.png' /tmp/news-card-studio.js
          for logo in sana aljazeera suhaib; do
            curl -fsSL --retry 2 "$base/source-logos/$logo.png" -o "/tmp/$logo.png"
            file "/tmp/$logo.png" | grep -q 'PNG image'
            test "$(wc -c <"/tmp/$logo.png")" -gt 1000
          done
          curl -fsSL --retry 2 -A 'Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36 MidanAlKhabarApp/1.3.9' "$base/" -o /tmp/index.html
          grep -q '/news-card-studio.js' /tmp/index.html
          grep -q 'id="newsList"' /tmp/index.html
          grep -q 'id="modalContent"' /tmp/index.html
          echo "PASS: live production JS, 3 official source images and preserved news UI" | tee midan-site-snapshot/feature/premium-production-smoke.txt
      - name: Commit verification evidence even on fail
        if: always()
        shell: bash
        run: |
          if [ -f midan-site-snapshot/feature/premium-production-smoke.txt ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add midan-site-snapshot/feature/premium-production-smoke.txt
            if ! git diff --cached --quiet; then git commit -m 'test(midan): premium cards production smoke passed'; git push; fi
          fi
