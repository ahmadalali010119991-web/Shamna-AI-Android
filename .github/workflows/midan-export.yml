name: Temporary Midan APK handoff
on:
  push:
    branches:
      - midan-release-export-20261109
jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate unsigned handoff
        run: |
          test -s .midan-handoff/unsigned-v1.3.2.apk
          test -s .midan-handoff/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: midan-unsigned-and-apksigner
          path: |
            .midan-handoff/unsigned-v1.3.2.apk
            .midan-handoff/apksigner.jar
          retention-days: 1
          if-no-files-found: error
