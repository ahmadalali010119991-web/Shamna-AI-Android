name: Inspect Hasibat 1.8.9 update guard and onCreate before additive heritage patch

on:
  push:
    branches: [main]
    paths: [.github/workflows/hasibat-inspect-heritage-patch.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download and decompile approved Hasibat release
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
          curl -fSL --retry 3 --max-time 90 \
            "https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar" -o apktool.jar
          python3 - <<'PY'
          import urllib.request,hashlib
          url="https://ftzmeimurgsqzvmcahhs.supabase.co/storage/v1/object/public/site-assets/b240bd5a-6536-42a3-8453-f309d1a053f1/ca9a5a74-ec08-4610-b7f3-b24c5def0c15.apk"
          data=urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"Hasibat-Additive-Builder/1"}),timeout=60).read(15_000_000)
          assert hashlib.sha256(data).hexdigest()=="00630b6141ae028db61c9649df907c482c57a7386ad1d032cea3e6392c5a0b81"
          open("base.apk","wb").write(data)
          PY
          java -jar apktool.jar d -f base.apk -o unpack
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging base.apk | head -1
          python3 - <<'PY'
          from pathlib import Path
          import re
          print("Classes inspected:")
          for filename in Path("unpack").glob("smali*/com/syrianlira/calculator/*.smali"):
              s=filename.read_text("utf-8")
              print(filename,":",len(s),"methods:",len(re.findall(r'^\.method',s,re.M)))
              if filename.name in ("MainActivity.smali","InAppUpdater.smali","UpdateMonitor.smali"):
                  keys=("onCreate(", "setContentView(", "checkUpdates(", "noteLatestVersion(", "discardOutdatedDownload(", "startOrInstall(", "onResume(")
                  lines=s.splitlines()
                  for idx,line in enumerate(lines):
                      if any(key in line for key in keys) and (line.strip().startswith(".method") or "setContentView" in line):
                          print("SNIPPET",filename.name,idx+1)
                          print("\n".join(lines[max(0,idx-5):idx+12])[:2500])
                  print("CONST",filename.name,[(i+1,l.strip()) for i,l in enumerate(lines) if re.search(r'\bconst(?:\/16|\/4)?\s+\w+,\s+0x16\b',l)][:28])
          print("apktool.yml:")
          print(Path("unpack/apktool.yml").read_text("utf-8")[:1200])
          PY
