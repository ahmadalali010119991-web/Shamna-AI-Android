name: Verify all dynamic Midan awareness cards in Chrome
on:
  push:
    branches: [midan-book-recovery-20261125]
    paths: ['.github/workflows/midan-dynamic-awareness-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Render every live awareness message and test both buttons
        shell: bash
        run: |
          set -eu
          export CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          cat > test.mjs <<'JS'
          import assert from 'node:assert/strict';
          import {spawn} from 'node:child_process';
          import {writeFileSync} from 'node:fs';
          const chrome=spawn(process.env.CHROME_PATH,['--headless=new','--no-sandbox','--disable-dev-shm-usage','--remote-debugging-port=9222','--remote-allow-origins=*','--window-size=390,844','about:blank'],{stdio:'ignore'});
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          try{
          let tabs;
          for(let i=0;i<40;i++){try{tabs=await(await fetch('http://localhost:9222/json/list')).json();break}catch{await sleep(250)}}
          assert(tabs?.length,'Chrome startup');const ws=new WebSocket(tabs.find(x=>x.type==='page').webSocketDebuggerUrl);await new Promise((resolve,reject)=>{ws.onopen=resolve;ws.onerror=reject});
          let seq=0;const pending=new Map();ws.onmessage=e=>{const m=JSON.parse(e.data);const p=pending.get(m.id);if(p){pending.delete(m.id);clearTimeout(p.timer);m.error?p.reject(Error(m.error.message)):p.resolve(m.result)}};
          function cdp(method,params={}){return new Promise((resolve,reject)=>{const id=++seq,timer=setTimeout(()=>{pending.delete(id);reject(Error('CDP timeout '+method))},120000);pending.set(id,{resolve,reject,timer});ws.send(JSON.stringify({id,method,params}))})}
          async function ev(expression){const r=await cdp('Runtime.evaluate',{expression,awaitPromise:true,returnByValue:true});if(r.exceptionDetails)throw Error(r.exceptionDetails.exception?.description||r.exceptionDetails.text);return r.result.value}
          await cdp('Page.enable');await cdp('Page.navigate',{url:'https://midan-archive.midan-khabar.workers.dev/'});
          let ready=false;for(let i=0;i<60;i++){try{ready=await ev("typeof MidanAwarenessCard==='object'&&typeof awarenessMessages!=='undefined'&&document.querySelector('#awarenessText')?.textContent.length>10");if(ready)break}catch{}await sleep(500)}assert(ready,'Live generator loaded');
          const result=await ev("(async()=>{const results=[];const norm=s=>s.replace(/ﷺ/g,'صلى الله عليه وسلم').replace(/\\s+/g,' ').trim();for(const m of awarenessMessages){const r=await MidanAwarenessCard.render(m);if(norm(r.layout.bodyLines.join(' '))!==norm(m.body))throw Error('lost text '+m.id);if(norm(r.layout.titleLines.join(' '))!==norm(m.title))throw Error('lost title '+m.id);if(r.layout.bodyHeight>r.layout.bodyArea||r.canvas.width!==1080||r.canvas.height!==1350)throw Error('layout '+m.id);const f=await MidanAwarenessCard.file(m);if(f.type!=='image/png'||f.size>5200000||f.size<80)throw Error('file '+m.id);const bytes=new Uint8Array(await f.slice(0,24).arrayBuffer());if(bytes[0]!==137||bytes[1]!==80||new DataView(bytes.buffer).getUint32(16)!==1080||new DataView(bytes.buffer).getUint32(20)!==1350)throw Error('PNG '+m.id);results.push({id:m.id,font:r.layout.bodyFont,bytes:f.size})}const text=MidanAwarenessCard.shareText(awarenessMessages[0]);if(!text.includes('t.me/maydan_alkhabar')||!text.includes('instagram.com/alislam_almutab_book')||!text.includes('tiktok.com/@alislam_almutab_book'))throw Error('social links');return results})()");
          assert.equal(result.length,53);assert.equal(new Set(result.map(x=>x.id)).size,53);console.log('PASS: 53/53 generated PNGs; all text and titles intact; all three social links; minimum body font '+Math.min(...result.map(x=>x.font)));
          const actions=await ev("(async()=>{const visible=document.querySelector('#awarenessText').textContent;let saved=null,shared=null;window.AndroidBridge={saveImagePng(data){saved=data}};window.MidanNativeNewsShare={available:()=>true,share:async packet=>{shared=packet;return {code:'CHOOSER_OPENED'}}};document.querySelector('#awarenessSave').click();for(let i=0;i<100&&!saved;i++)await new Promise(r=>setTimeout(r,50));if(!saved?.startsWith('data:image/png;base64,'))throw Error('save bridge');for(let i=0;i<100&&document.querySelector('#awarenessShare').disabled;i++)await new Promise(r=>setTimeout(r,50));document.querySelector('#awarenessShare').click();for(let i=0;i<100&&!shared;i++)await new Promise(r=>setTimeout(r,50));if(!shared||shared.files.length!==1||shared.files[0].type!=='image/png'||!shared.text.includes(visible))throw Error('share bridge');return {saved:true,shared:true}})()");
          assert(actions.saved&&actions.shared);console.log('PASS: save and share buttons deliver generated PNG via mocked Android bridge');
          const sample=await ev("(async()=>{const m=awarenessMessages.reduce((a,b)=>a.body.length>b.body.length?a:b);const r=await MidanAwarenessCard.render(m);return r.canvas.toDataURL('image/png').split(',')[1]})()");
          writeFileSync('awareness-longest.png',Buffer.from(sample,'base64'));ws.close();
          }finally{chrome.kill('SIGTERM')}
          JS
          node test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: awareness-longest-render
          path: awareness-longest.png
          retention-days: 3
