name: Verify original Midan photos served from Vercel preview
on:
  push:
    branches: [midan-news-original-photo-20261111]
    paths: [.github/workflows/midan-assets-preview-test.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify 41 PNG files without sending Telegram messages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,struct
          url='https://dallalna-telegram-bridge-cb9uv1n3c-ahmadalali010119991-6976.vercel.app'
          for i in range(1,42):
            u=f'{url}/awareness/Midan_AlKhabar_Message_{i:02}.png'
            with urllib.request.urlopen(u,timeout=20) as r:
              raw=r.read(24)
              if r.status!=200 or raw[:8]!=b'\x89PNG\r\n\x1a\n':raise ValueError(f'Image {i} invalid {r.status} {raw[:8]!r}')
              w,h=struct.unpack('>II',raw[16:24])
              if (w,h)!=(1254,1254):raise ValueError(f'Image {i} invalid geometry')
          print('ORIGINAL_IMAGE_ASSETS_41_PASS')
          PY
