name: Midan multi-route media resilience regression tests
on:
  push:
    paths:
      - 'midan-site-snapshot/bot-fixes/video-resilience-v4.js'
      - 'midan-site-snapshot/bot-fixes/test-video-resilience-v4.cjs'
      - '.github/workflows/midan-multiroute-video-v4-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  media-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify source syntax
        run: |
          node --check midan-site-snapshot/bot-fixes/video-resilience-v4.js
          node --check midan-site-snapshot/bot-fixes/sync-v3-multiroute.js
      - name: Test copy, forward, direct MP4, upload, recovery and idempotence
        run: node midan-site-snapshot/bot-fixes/test-video-resilience-v4.cjs
