name: Validate all 53 original PNGs and Midan daily schedule (no posting)
on:
  push:
    branches: [midan-news-original-photo-20261111]
    paths: [.github/workflows/midan-original-53-preview-test.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Verify 53 hosted original 1254px PNGs by exact SHA256, and no unauthenticated dispatch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,hashlib,struct,urllib.request,concurrent.futures
          root='https://dallalna-telegram-bridge-bbh38121f-ahmadalali010119991-6976.vercel.app'
          entries=json.load(open('telegram-shared/midan-awareness-manifest.json'))
          assert len(entries)==53
          def get(path):
            req=urllib.request.Request(root+path,headers={'User-Agent':'Midan-53-integrity/1.0'})
            with urllib.request.urlopen(req,timeout=40) as r:return r.status,r.headers.get('Content-Type',''),r.read()
          status,mime,body=get('/api/daily-v2?preview=awareness')
          metadata=json.loads(body)
          assert status==200 and metadata['count']==53
          print('DAILY_PREVIEW_METADATA_PASS',metadata['count'])
          def validate(item):
            status,mime,b=get('/awareness/'+item['file'])
            assert status==200,(item['id'],status)
            assert b[:8]==b'\x89PNG\r\n\x1a\n',(item['id'],'not png')
            assert struct.unpack('>II',b[16:24])==(1254,1254),(item['id'],'dimensions')
            assert len(b)==item['bytes'],(item['id'],'bytes',len(b))
            assert hashlib.sha256(b).hexdigest()==item['sha256'],(item['id'],'sha256')
            return item['id']
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
            results=list(pool.map(validate,entries))
          print('ORIGINAL_53_PNG_PASS',len(results),'FIRST',min(results),'LAST',max(results))
          try:
            req=urllib.request.Request(root+'/api/schedule',data=b'',method='POST')
            urllib.request.urlopen(req,timeout=15)
            raise AssertionError('Unauthorized schedule succeeded unexpectedly')
          except urllib.error.HTTPError as error:
            assert error.code==401,error.code
            print('NEWS_SCHEDULE_AUTH_PRESERVED')
          PY
