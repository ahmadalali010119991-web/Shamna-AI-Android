name: Probe real deployed gold/fuel PNG preview without Telegram posting
on:
  push:
    branches: [hasibat-telegram-gold-fuel-0900-20261111]
    paths: [.github/workflows/hasibat-assets-0900-preview.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Validate both preview images and preserved currency schedule
        shell: bash
        run: |
          set -euo pipefail
          HOST='https://dallalna-telegram-bridge-56se1qdhn-ahmadalali010119991-6976.vercel.app'
          for kind in gold fuel; do
            curl -sS --fail-with-body --max-time 55 "$HOST/api/daily-v2?preview=$kind" -o "/tmp/assets-$kind.png"
          done
          python3 - <<'PY'
          import struct,hashlib
          from pathlib import Path
          for kind in ('gold','fuel'):
            b=Path('/tmp/assets-'+kind+'.png').read_bytes()
            assert b[:8]==b'\x89PNG\r\n\x1a\n'
            w,h=struct.unpack('>II',b[16:24])
            assert w==1080 and 1600<h<2500
            assert len(b)>80000
            print('PREVIEW_PNG_OK',kind,w,h,len(b),hashlib.sha256(b).hexdigest()[:18])
          PY
          NEWS_CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 -X POST "$HOST/api/schedule")
          test "$NEWS_CODE" = "401" || { echo "News auth changed: $NEWS_CODE"; exit 1; }
          echo 'EXISTING_NEWS_AUTH_PRESERVED'
          HEALTH_CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$HOST/api/health")
          test "$HEALTH_CODE" = "200"
          echo 'HEALTH_PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: hasibat-gold-fuel-0900-vercel-preview-images
          path: /tmp/assets-*.png
          retention-days: 5
          if-no-files-found: error
