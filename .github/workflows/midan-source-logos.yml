name: Retrieve verified source identity images for Midan
on:
  push:
    paths:
      - '.github/workflows/midan-source-logos.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  logos:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: pip install pillow==11.3.0 cairosvg==2.8.2
      - run: python midan-site-snapshot/source-logo-fetch.py
      - run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add midan-site-snapshot/source-logos
          if ! git diff --cached --quiet; then git commit -m 'assets(midan): source visual identifiers'; git push; fi
