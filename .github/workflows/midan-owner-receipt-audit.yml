name: Verify exact recent Telegram video receipts
on:
  push:
    branches: [midan-book-recovery-20261125]
    paths: ['.github/workflows/midan-owner-receipt-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - run: |
          python3 - <<'PY'
          import urllib.request,hashlib,re
          from html.parser import HTMLParser
          from urllib.parse import urlsplit
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.ids=[];self.links=[];self.urls=[];self.text=[]
              def handle_starttag(self,t,attrs):
                  a=dict(attrs)
                  if a.get('data-post'): self.ids.append(a['data-post'])
                  if t=='a' and a.get('href'): self.links.append(a['href'])
                  if t=='video' and 'js-message_video_blured' not in a.get('class','') and a.get('src'):self.urls.append(a['src'])
              def handle_data(self,d):self.text.append(d)
          for mid in range(1605,1611):
              try:
                  req=urllib.request.Request(f'https://t.me/maydan_alkhabar/{mid}?embed=1',headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=15) as r:s=r.read(524288).decode('utf-8','replace')
                  p=P();p.feed(s)
                  exact=f'maydan_alkhabar/{mid}' in [i.lower() for i in p.ids]
                  links=[x for x in p.links if re.search(r'private-source99-\d+',x)]
                  ids=sorted(set(re.findall(r'private-source99-\d+', ' '.join(links))))
                  print('MID',mid,'identity',exact,'source_ids',ids,'private_label','خاص بميدان الخبر' in ' '.join(p.text),'video',len(p.urls))
                  if not exact or len(p.urls)!=1 or not ids:continue
                  u=urlsplit(p.urls[0])
                  if u.scheme!='https' or not (u.hostname.endswith('.telesco.pe') or u.hostname.endswith('.telegram-cdn.org')):continue
                  with urllib.request.urlopen(p.urls[0],timeout=25) as r:
                      b=r.read(20*1024*1024+1)
                  if len(b)>20*1024*1024:continue
                  print('VIDEO',mid,'bytes',len(b),'sha256',hashlib.sha256(b).hexdigest(),'mp4',b[4:8]==b'ftyp')
              except Exception as e:print('MID',mid,'unavailable',type(e).__name__,getattr(e,'code',''))
          PY
