name: Verify Midan Private Source ingestion
on:
  push:
    branches: [main]
    paths:
      - 'tools/midan-publisher/private-source99.cjs'
      - 'tools/midan-publisher/private-source99.test.cjs'
      - '.github/workflows/midan-private-source-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test tools/midan-publisher/private-source99.test.cjs
