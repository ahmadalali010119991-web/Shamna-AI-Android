name: Midan isolated state cleanup smoke
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/midan-state-cleanup-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: midan-isolated-state-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify isolated state deletion preflight
        shell: bash
        env:
          ENDPOINT: https://dallalna-telegram-bridge.vercel.app/api/status-v2?isolatedStateSmoke=20261113
        run: |
          set -euo pipefail
          token="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=dallalna-telegram-bridge" | jq -r .value)"
          test -n "$token" && test "$token" != null
          result="$(curl --fail-with-body --silent --show-error --max-time 75 \
            -X POST -H "Authorization: Bearer ${token}" \
            -H "Content-Type: application/json" \
            --data '{"operation":"probe"}' \
            "${ENDPOINT}")"
          echo "$result" | jq '{ok,stage,delete,stillAbsent,written,error}'
          echo "$result" | jq -e '.stage == "delete_probe" or .stage == "delete_probe_unsupported" or .stage == "read_or_probe_failed"' >/dev/null
