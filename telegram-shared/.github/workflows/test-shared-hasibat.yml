name: Validate exact Hasibat Telegram picture renderer (no publishing)
on:
  push:
    branches: [hasibat-telegram-shared-renderer-20261111]
    paths: [telegram-shared/**]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: '22'}
      - name: Install pinned rendering dependencies
        working-directory: telegram-shared
        run: npm install --no-audit --no-fund
      - name: Check scheduler and calculation invariants
        working-directory: telegram-shared
        run: npm test
      - name: Draw real exchange image using current public feed
        working-directory: telegram-shared
        run: npm run preview
      - name: Save sample images (never send to Telegram)
        uses: actions/upload-artifact@v4
        with:
          name: hasibat-telegram-preview-png
          path: /tmp/hasibat-preview-*.png
          if-no-files-found: error
          retention-days: 3
